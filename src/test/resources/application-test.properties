# Profilo di test: H2 in memoria in modalita' PostgreSQL, con lo schema reale
# dell'aggregato pendenza.
#
# ddl-auto=validate, non create-drop: lo schema NON viene generato dalle entita', si
# carica quello di produzione e le entita' vengono validate contro di esso. E' l'unico
# modo per accorgersi di una colonna con il nome sbagliato.
#
# Lo schema e' caricato dal parametro INIT del driver H2 e non da spring.sql.init:
# deve esistere prima che Hibernate esegua la validazione, quindi va creato
# all'apertura della connessione, non da un inizializzatore applicativo.

spring.datasource.url=jdbc:h2:mem:pendenze-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'classpath:db/schema-pendenze-test.sql'
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Invio eventi GDE sincrono nei test: nessun connettore GDE configurato nel DB
# di test, quindi AbstractGdeService.isAbilitato() e' sempre false e nessuna
# chiamata HTTP reale viene mai tentata — sincrono solo per rendere
# deterministico l'ordine delle operazioni nei test che verificano il filtro.
app.gde.async=false

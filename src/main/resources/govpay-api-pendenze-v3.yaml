openapi: 3.1.0
info:
  version: "3.0.0"
  title: GovPay - API Pendenze
  description: >-
    API di integrazione GovPay per la gestione delle pendenze, destinate ai
    sistemi verticali dell'Ente Creditore e alle altre applicazioni
    preventivamente censite e autorizzate sull'istanza GovPay. Per il
    censimento delle applicazioni, le credenziali di accesso e ulteriori
    dettagli si rimanda alla documentazione ufficiale:
    https://govpay.readthedocs.io/it/latest/integrazione/api/index.html.

    Le versioni minor o di bugfix successive all'interno di questa major
    version (v3) possono introdurre nuovi campi nei payload di richiesta e
    di risposta, senza che ciò costituisca una modifica incompatibile.
    Perché le integrazioni realizzate su questa major version continuino a
    funzionare correttamente anche dopo tali evolutive, i client DEVONO
    tollerare e ignorare eventuali campi non riconosciuti, sia nelle
    risposte ricevute che, se già presenti in una richiesta per altri
    scopi, nei payload inviati. Coerentemente, gli schemi di questa
    specifica non vincolano l'insieme di proprietà accettate/restituite a
    quello esplicitamente documentato.

    Correlazione delle richieste: il client può inviare in ogni richiesta
    l'header `X-Correlation-ID` (in alternativa `X-Request-ID`), con un
    valore di al massimo 128 caratteri tra lettere, cifre e `.`, `_`, `:`,
    `-`. Il servizio lo registra nei propri log e lo restituisce
    nell'header di risposta `X-Correlation-ID`; se è assente o non valido
    ne genera uno nuovo. Ogni risposta riporta inoltre in
    `X-Transaction-ID` l'identificativo della transazione assegnato dal
    servizio.

    Limiti di utilizzo: il rate limiting è applicato dal gateway di
    erogazione (es. GovWay) secondo le politiche configurate. Quando una
    politica è attiva, ogni risposta riporta gli header `X-RateLimit-Limit`,
    `X-RateLimit-Remaining` e `X-RateLimit-Reset`; al superamento del limite
    la risposta è `429 Too Many Requests` con l'header `Retry-After`. Anche
    le risposte `503 Service Unavailable` riportano `Retry-After`, con i
    secondi dopo i quali ripetere la richiesta.

    Stato del servizio: `GET /status` risponde senza autenticazione `200`
    se il servizio è operativo, `503` altrimenti.

    Codifica dei caratteri: tutti i payload JSON, di richiesta e di
    risposta, sono codificati in UTF-8, dichiarato con il parametro
    `charset=UTF-8` del `Content-Type`.

    Errori: le risposte di errore sono in formato Problem (RFC 7807), con
    Content-Type `application/problem+json`. `title` riporta la reason
    phrase HTTP dello status (es. `Conflict`); la spiegazione specifica
    del singolo errore è in `detail`.

    Nomi dei campi: i campi seguono lo stile camelCase, con l'eccezione
    delle ricevute nei formati `ctReceipt` e `ctReceiptV2`, che riportano
    tali e quali i nomi del tracciato pagoPA (es. `PSPCompanyName`,
    `IBAN`, `MBDAttachment`), per consentire il confronto diretto con la
    ricevuta del Nodo dei Pagamenti.
  contact:
    name: GitHub Project Page
    url: 'https://github.com/link-it/GovPay/'
  license:
    name: GPL
    url: 'https://github.com/link-it/GovPay/blob/master/LICENSE'
servers:
  - url: /v3
    description: Base path predefinito del servizio
  - url: /govpay/backend/api/pendenze/rs/basic/v3
    description: Base path compatibile con il monolite GovPay, da configurare
tags:
  - name: PosizioniDebitorie
    description: Alimentazione e consultazione delle posizioni debitorie
  - name: Pendenze
    description: Consultazione e aggiornamento puntuale delle singole pendenze (rate)
  - name: Stato
    description: Stato del servizio
security:
  - basicAuth: []
paths:

  # ============================================================
  # STATO DEL SERVIZIO
  # ============================================================

  '/status':
    get:
      tags:
        - Stato
      summary: Stato del servizio
      description: >-
        Restituisce lo stato del servizio: `200` se è operativo, `503` se una
        delle sue dipendenze (es. il database) non è disponibile. Non richiede
        autenticazione.
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Il servizio è operativo
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  value:
                    status: 200
                    title: OK
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  # ============================================================
  # POSIZIONI DEBITORIE
  # ============================================================

  '/posizioni-debitorie/{idA2A}':
    get:
      tags:
        - PosizioniDebitorie
      summary: Elenco delle posizioni debitorie
      operationId: findPosizioniDebitorie
      description: >-
        Fornisce la lista delle posizioni debitorie del gestionale che
        hanno tra i debitori quello indicato.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - $ref: '#/components/parameters/idDebitore'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/total'
      responses:
        '200':
          description: Elenco delle posizioni debitorie che rispettano i filtri di ricerca
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PosizioniDebitorie'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
    post:
      tags:
        - PosizioniDebitorie
      summary: Creazione di una posizione debitoria
      operationId: addPosizioneDebitoria
      description: >-
        Crea una nuova posizione debitoria, comprensiva dei suoi debitori
        (anche co-obbligati in solido), ciascuno con le proprie opzioni di
        pagamento alternative (es. unica soluzione, piano rateale) e le
        relative pendenze (rate). Le opzioni vanno indicate per ciascun
        debitore: la corrispondenza tra le opzioni dei co-obbligati è
        responsabilità del gestionale, non è verificata.
        Un secondo tentativo di creazione con lo stesso codDocumento per lo
        stesso idA2A e lo stesso idDominio viene rifiutato (409): l'operazione
        crea la posizione debitoria esattamente una volta e non aggiorna una
        posizione esistente. Se la
        notifica SEND di un debitore è attiva (`notificaSend`), il suo
        `navNotifica` è obbligatorio e deve corrispondere al `numeroAvviso`
        di una delle pendenze di quel debitore: la richiesta è rifiutata con
        400 in caso contrario.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/NuovaPosizioneDebitoria'
            examples:
              unicaSoluzione:
                summary: >-
                  Caso più semplice e più frequente: un'unica pendenza da
                  pagare in un'unica soluzione
                value:
                  codDocumento: CERT2026-000058
                  idDominio: '12345678901'
                  descrizione: 'Diritti di segreteria - certificato di residenza'
                  debitori:
                    - soggetto:
                        tipo: F
                        identificativo: FRRPLA90C41H501Y
                        anagrafica: Paola Ferrari
                      opzioniPagamento:
                        - tipologia: SOLUZIONE_UNICA
                          pendenze:
                            - idPendenza: CERT2026-000058-UNICA
                              idTipoPendenza: DIRITTI_SEGRETERIA
                              importo: 16.00
                              voci:
                                - idVocePendenza: CERT2026-000058-UNICA_1
                                  importo: 16.00
                                  descrizione: 'Diritti di segreteria - certificato di residenza'
                                  tipoRiferimento: RIFERIMENTO_ENTRATA
                                  codEntrata: DIRITTI_SEGRETERIA
              unicaSoluzioneORateale:
                summary: >-
                  Debito pagabile in un'unica soluzione oppure, in
                  alternativa, in 3 rate
                value:
                  codDocumento: IMU2026-000017
                  idDominio: '12345678901'
                  descrizione: 'IMU 2026 - immobile in via Garibaldi 5'
                  debitori:
                    - soggetto:
                        tipo: F
                        identificativo: VRDGNN80A01H501W
                        anagrafica: Giovanna Verdi
                      opzioniPagamento:
                        - tipologia: SOLUZIONE_UNICA
                          dataScadenza: '2026-06-16'
                          pendenze:
                            - idPendenza: IMU2026-000017-UNICA
                              idTipoPendenza: IMU
                              importo: 600.00
                              voci:
                                - idVocePendenza: IMU2026-000017-UNICA_1
                                  importo: 600.00
                                  descrizione: 'IMU 2026 - saldo unico'
                                  tipoRiferimento: RIFERIMENTO_ENTRATA
                                  codEntrata: IMU
                        - tipologia: PIANO_RATEALE
                          dataScadenza: '2026-12-16'
                          pendenze:
                            - idPendenza: IMU2026-000017-R1
                              idTipoPendenza: IMU
                              importo: 200.00
                              voci:
                                - idVocePendenza: IMU2026-000017-R1_1
                                  importo: 200.00
                                  descrizione: 'IMU 2026 - rata 1 di 3'
                                  tipoRiferimento: RIFERIMENTO_ENTRATA
                                  codEntrata: IMU
                            - idPendenza: IMU2026-000017-R2
                              idTipoPendenza: IMU
                              importo: 200.00
                              voci:
                                - idVocePendenza: IMU2026-000017-R2_1
                                  importo: 200.00
                                  descrizione: 'IMU 2026 - rata 2 di 3'
                                  tipoRiferimento: RIFERIMENTO_ENTRATA
                                  codEntrata: IMU
                            - idPendenza: IMU2026-000017-R3
                              idTipoPendenza: IMU
                              importo: 200.00
                              voci:
                                - idVocePendenza: IMU2026-000017-R3_1
                                  importo: 200.00
                                  descrizione: 'IMU 2026 - rata 3 di 3'
                                  tipoRiferimento: RIFERIMENTO_ENTRATA
                                  codEntrata: IMU
              multaConRiduzione:
                summary: >-
                  Sanzione con riduzione del 30% se pagata entro 5 giorni,
                  altrimenti a tariffa intera
                value:
                  codDocumento: VERBALE2026-000123
                  idDominio: '12345678901'
                  descrizione: 'Verbale n. 123/2026 - violazione art. 142 CdS'
                  debitori:
                    - soggetto:
                        tipo: F
                        identificativo: BNCLRA75B02H501K
                        anagrafica: Laura Bianchi
                      opzioniPagamento:
                        - tipologia: SOLUZIONE_UNICA_ENTRO
                          giorni: 5
                          pendenze:
                            - idPendenza: VERBALE2026-000123-RIDOTTA
                              idTipoPendenza: SANZIONE_CDS
                              importo: 70.00
                              voci:
                                - idVocePendenza: VERBALE2026-000123-RIDOTTA_1
                                  importo: 70.00
                                  descrizione: >-
                                    Sanzione in misura ridotta (-30%), pagamento
                                    entro 5 giorni dalla notifica
                                  tipoRiferimento: RIFERIMENTO_ENTRATA
                                  codEntrata: SANZIONE_CDS
                        - tipologia: SOLUZIONE_UNICA_OLTRE
                          giorni: 5
                          pendenze:
                            - idPendenza: VERBALE2026-000123-INTERA
                              idTipoPendenza: SANZIONE_CDS
                              importo: 100.00
                              voci:
                                - idVocePendenza: VERBALE2026-000123-INTERA_1
                                  importo: 100.00
                                  descrizione: >-
                                    Sanzione in misura intera, pagamento dopo il
                                    5° giorno dalla notifica
                                  tipoRiferimento: RIFERIMENTO_ENTRATA
                                  codEntrata: SANZIONE_CDS
      responses:
        '201':
          description: >-
            Posizione debitoria creata. La risposta contiene lo stesso
            contenuto di una GET sulla risorsa appena creata (comprese le
            opzioni di pagamento e le pendenze generate).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              description: URL della posizione debitoria creata (`/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}`)
              schema:
                type: string
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PosizioneDebitoria'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Esiste già una posizione debitoria con questo codDocumento per questo idA2A e questo idDominio
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  value:
                    status: 409
                    title: Conflict
                    detail: Esiste già una posizione debitoria con questo codDocumento per questo idA2A e questo idDominio
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}':
    get:
      tags:
        - PosizioniDebitorie
      summary: Dettaglio di una posizione debitoria
      operationId: getPosizioneDebitoria
      description: >-
        Acquisisce il dettaglio della posizione debitoria, comprensivo di
        tutte le opzioni di pagamento e delle relative pendenze (rate).
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
      responses:
        '200':
          description: Informazioni dettagliate della posizione debitoria
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PosizioneDebitoria'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
    patch:
      tags:
        - PosizioniDebitorie
      summary: Aggiornamento di uno o più campi di una posizione debitoria
      operationId: updatePosizioneDebitoria
      description: >-
        Aggiorna `descrizione` e `dataPubblicazione` della posizione
        debitoria. I debitori e le loro opzioni di pagamento non si
        aggiornano qui: per aggiungere le opzioni si usa
        `POST .../opzioni-pagamento`, per cambiarne lo stato
        `PATCH .../opzioni-pagamento/{idOpzionePagamento}`.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
      requestBody:
        content:
          application/json-patch+json;charset=UTF-8:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOp'
              description: Lista di operazioni JSON Patch (RFC 6902) da applicare
      responses:
        '200':
          description: Posizione debitoria aggiornata con successo
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            La posizione debitoria è stata modificata concorrentemente da
            un'altra richiesta: rileggerla e riprovare.
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/debitori':
    post:
      tags:
        - PosizioniDebitorie
      summary: Aggiunta di un debitore a una posizione debitoria esistente
      operationId: addDebitore
      description: >-
        Aggiunge un debitore, con le sue opzioni di pagamento, a una posizione
        debitoria già esistente. Valgono le regole della creazione: almeno
        un'opzione, `identificativo` univoco tra i debitori della posizione,
        `navNotifica` obbligatorio se `notificaSend` è attivo. La
        corrispondenza con le opzioni degli altri debitori non è verificata.
        Si può aggiungere un debitore con lo stesso `identificativo` di uno
        rimosso. Rifiutata (409) se la posizione ha già un'opzione di pagamento
        ATTIVATA.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
      requestBody:
        required: true
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/NuovoDebitorePosizione'
      responses:
        '201':
          description: Debitore aggiunto
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/DebitorePosizione'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            La posizione debitoria ha già un'opzione di pagamento ATTIVATA
            (pagamento già eseguito), è stata modificata concorrentemente, o
            una pendenza ha un idPendenza già usato da un'altra pendenza della
            stessa applicazione.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':

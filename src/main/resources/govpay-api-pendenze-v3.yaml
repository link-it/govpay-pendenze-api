              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          description: 'Header `Accept` non compatibile con `application/pdf`'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
        '502':
          description: 'Errore di comunicazione con il microservizio `govpay-stampe`'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            Microservizio `govpay-stampe` non configurato
            (`app.stampe.base-url` mancante)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'

  '/pendenze/{idA2A}/{idPendenza}/rendicontazioni':
    get:
      tags:
        - Pendenze
      summary: Elenco delle rendicontazioni di una pendenza
      operationId: findRendicontazioniPendenza
      description: >-
        Fornisce le rendicontazioni ricevute da pagoPA per la pendenza,
        comprensive dei dati di testata del flusso di rendicontazione a
        cui appartengono. L'elenco include le rendicontazioni di tutte le
        revisioni dei flussi, comprese quelle obsolete.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPendenza
          description: Identificativo della pendenza
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/total'
      responses:
        '200':
          description: Elenco delle rendicontazioni della pendenza
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Rendicontazioni'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    idDominio:
      name: idDominio
      in: query
      description: >-
        Identificativo del dominio dell'ente. Filtro aggiuntivo opzionale,
        utilizzabile solo insieme a `numeroAvviso`: non è consentita una
        ricerca per solo idDominio.
      required: false
      schema:
        type: string
    numeroAvviso:
      name: numeroAvviso
      in: query
      description: >-
        Identificativo dell'avviso di pagamento pagoPA. Unico criterio di
        ricerca delle pendenze, da solo o abbinato a `idDominio`.
      required: true
      schema:
        type: string
        pattern: '(^[0-9]{18}$)'
      example: '123456789012345678'
    idDebitore:
      name: idDebitore
      in: query
      description: >-
        Identificativo (codice fiscale o partita IVA) di un debitore. In
        presenza di più debitori in solido, la ricerca trova la posizione
        debitoria se il valore corrisponde a QUALSIASI dei suoi debitori.
        Unico criterio di ricerca delle posizioni debitorie.
      required: true
      schema:
        type: string
      example: 'RSSMRA30A01H501I'
    fields:
      name: fields
      in: query
      description: >-
        Elenco separato da virgole dei campi da restituire per ciascun
        risultato, per limitare la dimensione della risposta.
      required: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: >-
        Numero di risultati da saltare (0 per partire dal primo), in
        modalità di paginazione a offset: la pagina successiva si ottiene
        con `offset` aumentato di `limit`. Alternativo a `cursor`: non è
        consentito specificare entrambi nella stessa richiesta. Se nessuno
        dei due è specificato, si applica la modalità a offset con
        `offset=0`.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      example: 0
    cursor:
      name: cursor
      in: query
      description: >-
        Cursore opaco (il valore `nextCursor` della risposta precedente)
        da cui continuare l'elenco, in modalità di paginazione a cursore.
        Alternativo a `offset`: non è consentito specificare entrambi
        nella stessa richiesta. In questa modalità l'ordinamento dei
        risultati è quello fisso previsto per la risorsa, e non è
        influenzato da `sort`.
      required: false
      schema:
        type: string
    total:
      name: total
      in: query
      description: >-
        Se `true`, calcola e restituisce in `pagination.totalResults` e
        `pagination.totalPages` il conteggio complessivo dei risultati
        che rispettano i filtri di ricerca (richiede una query aggiuntiva
        di conteggio). Ignorato in modalità cursore.
      required: false
      schema:
        type: boolean
        default: false
      example: false
    limit:
      name: limit
      in: query
      description: Numero massimo di risultati per pagina (max 200).
      required: false
      schema:
        $ref: '#/components/schemas/Limit'
    sort:
      name: sort
      in: query
      description: >-
        Criterio di ordinamento dei risultati: uno o più campi nella
        forma `campo:asc` o `campo:desc`, separati da virgola (priorità
        nell'ordine specificato). Ignorato in modalità cursore, dove
        l'ordinamento è quello fisso previsto per la risorsa. Se assente
        (in modalità a offset), si applica l'ordinamento predefinito
        della risorsa.
      required: false
      schema:
        type: string
      example: 'dataCreazione:desc'
  headers:
    CacheControl:
      description: >-
        Il caching delle risposte è disabilitato: il servizio restituisce
        sempre `no-cache, no-store, max-age=0, must-revalidate`.
      schema:
        type: string
      example: 'no-cache, no-store, max-age=0, must-revalidate'
    CorrelationId:
      description: >-
        Identificativo di correlazione della richiesta, utile per
        ricondurre la chiamata ai log del servizio. È il valore ricevuto
        nell'header di richiesta `X-Correlation-ID` (o `X-Request-ID`) se
        presente e valido, altrimenti è generato dal servizio. Lo stesso
        valore è restituito anche nell'header `X-Request-ID`.
      schema:
        type: string
        maxLength: 128
      example: 'b5a1c3e2-7f4d-4c1a-9e8b-2d6f0a9c1e34'
    TransactionId:
      description: >-
        Identificativo univoco della transazione, generato dal servizio a
        ogni richiesta e mai accettato dal client. Lo stesso valore è
        restituito anche nell'header `X-Govpay-IdTransazione`.
      schema:
        type: string
      example: '0f2c9d7e-3a41-4b8e-9c55-61e2b7a0d913'
    RateLimitLimit:
      description: >-
        Numero massimo di richieste ammesse nella finestra temporale corrente.
        Valorizzato dal gateway di erogazione (es. GovWay) quando è attiva una
        politica di rate limiting; assente altrimenti.
      schema:
        type: integer
        format: int32
      example: 100
    RateLimitRemaining:
      description: >-
        Numero di richieste ancora disponibili nella finestra temporale
        corrente. Valorizzato dal gateway di erogazione quando è attiva una
        politica di rate limiting; assente altrimenti.
      schema:
        type: integer
        format: int32
      example: 99
    RateLimitReset:
      description: >-
        Secondi mancanti all'inizio della prossima finestra temporale.
        Valorizzato dal gateway di erogazione quando è attiva una politica di
        rate limiting; assente altrimenti.
      schema:
        type: integer
        format: int32
      example: 60
    RetryAfter:
      description: >-
        Secondi dopo i quali il client può ripetere la richiesta.
      schema:
        type: integer
        format: int32
      example: 60

  responses:
    400BadRequest:
      description: Richiesta non valida
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 400
                title: Bad Request
                detail: "Il campo 'importo' non può essere negativo"
    401NotAuthenticated:
      description: Utenza non autenticata
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 401
                title: Unauthorized
                detail: Utenza non autenticata
    403NotAuthorized:
      description: Utenza non autorizzata a eseguire l'operazione richiesta
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 403
                title: Forbidden
                detail: Utenza non autorizzata a eseguire l'operazione richiesta
    404NotFound:
      description: Risorsa non trovata
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 404
                title: Not Found
                detail: Risorsa non trovata
    415UnsupportedMediaType:
      description: >-
        Content-Type della richiesta non supportato: il corpo va inviato
        con il media type indicato per l'operazione
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 415
                title: Unsupported Media Type
    429TooManyRequests:
      description: >-
        Raggiunto il limite di richieste ammesse. Restituita dal gateway di
        erogazione quando è attiva una politica di rate limiting.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 429
                title: Too Many Requests
    503ServiceUnavailable:
      description: Servizio temporaneamente non disponibile
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 503
                title: Service Unavailable
    500ServiceUnavailable:
      description: Errore interno del servizio
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        X-Transaction-ID:
          $ref: '#/components/headers/TransactionId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 500
                title: Internal Server Error
                detail: Errore interno del servizio
                type: 'https://govpay.readthedocs.io/it/latest/manuale/errori/INTERNO'

  schemas:

    # ============================================================
    # POSIZIONE DEBITORIA - SCRITTURA
    # ============================================================

    NuovaPosizioneDebitoria:
      type: object
      required:
        - codDocumento
        - idDominio
        - descrizione
        - debitori
      properties:
        codDocumento:
          type: string
          description: >-
            Identificativo della posizione debitoria scelto liberamente dal
            gestionale proprietario. Deve essere univoco per idA2A+idDominio:
            la richiesta viene rifiutata con 409 se esiste già una posizione
            con questo identificativo per lo stesso idA2A e lo stesso
            idDominio (due domini diversi possono invece riusare lo stesso
            valore). Non coincide con `idPosizioneDebitoria` esposto in
            lettura: quello è l'IUPD (standard pagoPA GPD), calcolato da
            GovPay concatenando idA2A+idDominio+codDocumento.
          examples:
            - abcdef12345
          pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        idDominio:
          type: string
          description: Identificativo del dominio creditore
          examples:
            - '1234567890'
          minLength: 1
          maxLength: 35
          pattern: '(^([0-9]){11}$)'
        idUnitaOperativa:
          type: string
          description: Identificativo dell'unita' operativa
          examples:
            - UO33132
          minLength: 1
          maxLength: 35
          pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        descrizione:
          type: string
          description: Descrizione generale della posizione debitoria
          examples:
            - 'Sanzione CdS n. abc00000'
          maxLength: 140
        debitori:
          type: array
          description: >-
            Debitori della posizione debitoria. In presenza di più debitori
            (co-obbligati in solido) ciascuno ha le proprie opzioni di
            pagamento, quindi le proprie pendenze e i propri numeri avviso.
            Ogni debitore, identificato dal suo `identificativo`, compare una
            sola volta.
          minItems: 1
          items:
            $ref: '#/components/schemas/NuovoDebitorePosizione'
        dataPubblicazione:
          type: string
          format: date
          description: >-
            Data a partire dalla quale la posizione debitoria (e tutte le
            sue pendenze) diventa visibile e pagabile. Fino a tale data si
            comporta come se non esistesse per qualsiasi ricerca/pagamento
            esterno (Nodo dei Pagamenti, ricerca per avviso); resta invece
            sempre visibile e gestibile per l'applicazione che l'ha creata.
            Al momento della pubblicazione viene, tra le altre cose, inviata
            la notifica ai debitori (email/AppIO/altro canale configurato).
            Se non specificata, la posizione debitoria è pubblicata
            immediatamente.
          examples:
            - '2026-01-15'

    NuovoDebitorePosizione:
      type: object
      description: >-
        Un debitore della posizione debitoria, con la notifica SEND e le
        opzioni di pagamento che lo riguardano.
      required:
        - soggetto
        - opzioniPagamento
      properties:
        soggetto:
          $ref: '#/components/schemas/Soggetto'
        notificaSend:
          type: boolean
          description: >-
            Indica se il debitore è notificato (o va notificato) tramite
            SEND. Se attivo, GovPay maggiora l'importo pagato in sede di
            pagamento con le spese di notifica SEND. Non va attivato se le
            pendenze del debitore includono già tali spese nel proprio
            importo (voce con dettaglioContabile di tipo SPESE_NOTIFICA). Se
            assente, equivale a `false`.
        navNotifica:
          type: string
          description: >-
            NAV (numero avviso) a cui l'Ente ha agganciato le spese di
            notifica SEND del debitore. Obbligatorio se `notificaSend` è
            attivo; deve corrispondere al `numeroAvviso` di una delle
            pendenze del debitore (che l'Ente valorizza quindi
            esplicitamente). GovPay non lo assegna automaticamente.
          pattern: '(^[0-9]{18}$)'
        opzioniPagamento:
          type: array
          description: >-
            Modalità alternative con cui può essere estinta la posizione
            debitoria per questo debitore (es. pagamento in un'unica
            soluzione oppure piano rateale). Ricalca il modello "Opzioni di
            pagamento" di pagoPA
            (https://developer.pagopa.it/pago-pa/guides/sanp/ente-creditore/opzioni-di-pagamento).
          minItems: 1
          items:
            $ref: '#/components/schemas/NuovaOpzionePagamento'

    NuovaOpzionePagamentoDebitore:
      type: object
      description: >-
        Nuova opzione di pagamento da aggiungere a un debitore di una
        posizione già esistente.
      required:
        - identificativoDebitore
        - opzionePagamento
      properties:
        identificativoDebitore:
          type: string
          description: >-
            Identificativo (codice fiscale o partita iva) del debitore della
            posizione a cui si aggiunge l'opzione.
          examples:
            - RSSMRA30A01H501I
          minLength: 2
          maxLength: 16
        opzionePagamento:
          $ref: '#/components/schemas/NuovaOpzionePagamento'

    TipologiaOpzionePagamento:
      type: string
      description: >-
        Modalità con cui può essere estinta la posizione debitoria.
      enum:
        - PIANO_RATEALE
        - SOLUZIONE_UNICA
        - SOLUZIONE_UNICA_ENTRO
        - SOLUZIONE_UNICA_OLTRE
        - SOLUZIONE_UNICA_RIDOTTO
        - SOLUZIONE_UNICA_SCONTATO
      examples:
        - SOLUZIONE_UNICA

    NuovaOpzionePagamento:
      type: object
      description: >-
        Modalità con cui può essere estinta la posizione debitoria (es.
        pagamento in un'unica soluzione oppure piano rateale). Ogni
        tipologia impone un proprio vincolo sulla cardinalità di `pendenze`
        e sui campi obbligatori.
      required: [tipologia]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
      oneOf:
        - $ref: '#/components/schemas/NuovaOpzionePagamentoPianoRateale'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnica'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaEntro'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaOltre'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaRidotto'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaScontato'
      discriminator:
        propertyName: tipologia
        mapping:
          PIANO_RATEALE: '#/components/schemas/NuovaOpzionePagamentoPianoRateale'
          SOLUZIONE_UNICA: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnica'
          SOLUZIONE_UNICA_ENTRO: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaEntro'
          SOLUZIONE_UNICA_OLTRE: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaOltre'
          SOLUZIONE_UNICA_RIDOTTO: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaRidotto'
          SOLUZIONE_UNICA_SCONTATO: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaScontato'

    NuovaOpzionePagamentoPianoRateale:
      type: object
      required: [tipologia, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: >-
            Le rate del piano, nell'ordine in cui vanno pagate: GovPay
            assegna `numeroRata` in base alla posizione di ciascuna
            pendenza in questo array. Servono almeno due rate: con una
            sola si usa SOLUZIONE_UNICA.
          minItems: 2
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnica:
      type: object
      required: [tipologia, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: >-
            Una o più pendenze pagabili in un'unica soluzione: più di una
            solo quando il dovuto supera le 5 voci ammesse per un singolo
            avviso di pagamento, e va quindi ripartito su più avvisi. La
            logica è la stessa del piano rateale (la posizione è pagata
            quando tutte le sue pendenze sono pagate): cambia solo il
            layout di stampa degli avvisi.
          minItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnicaEntro:
      type: object
      required: [tipologia, giorni, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          allOf:
            - $ref: '#/components/schemas/giornoOpzionePagamento'
          description: >-
            Numero di giorni entro cui va eseguito il pagamento. Il
            conteggio non decorre necessariamente dalla creazione della
            posizione debitoria: può ad esempio partire dal momento in cui
            il debitore seleziona questa opzione tra quelle disponibili.
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: Esattamente una pendenza per l'intero importo.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnicaOltre:
      type: object
      required: [tipologia, giorni, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          allOf:
            - $ref: '#/components/schemas/giornoOpzionePagamento'
          description: >-
            Numero di giorni decorsi i quali il pagamento diventa possibile
            (non prima). Il conteggio non decorre necessariamente dalla
            creazione della posizione debitoria: può ad esempio partire dal
            momento in cui il debitore seleziona questa opzione tra quelle
            disponibili.
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: Esattamente una pendenza per l'intero importo.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnicaRidotto:
      type: object
      description: >-
        Sanzione del Codice della Strada in misura ridotta. Nessun campo
        `giorni`: il termine di legge non è un valore dichiarabile dal
        chiamante.
      required: [tipologia, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: Esattamente una pendenza per l'intero importo.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnicaScontato:
      type: object
      description: >-
        Sanzione del Codice della Strada con sconto per pagamento in forma
        agevolata. Nessun campo `giorni`: il termine di legge non è un
        valore dichiarabile dal chiamante.
      required: [tipologia, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: Esattamente una pendenza per l'intero importo.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    dataInizioValiditaOpzionePagamento:
      type: string
      format: date
      description: >-
        Data a partire dalla quale questa opzione di pagamento (e tutte le
        pendenze/rate che la compongono) diventa pagabile. Se assente, è
        pagabile da subito.
      examples:
        - '2026-01-15'
    dataScadenzaOpzionePagamento:
      type: string
      format: date
      description: >-
        Data fino alla quale questa opzione di pagamento (e tutte le
        pendenze/rate che la compongono) resta pagabile. Governa un piano
        rateale nel suo complesso: superata questa data nessuna rata resta
        pagabile, indipendentemente dalle rate già scadute individualmente,
        così che un piano avviato non decada rata per rata. Se assente,
        l'opzione non ha una scadenza di pagamento.
      examples:
        - '2026-06-30'

    giornoOpzionePagamento:
      type: integer
      format: int32
      minimum: 1
      maximum: 3650
      description: >-
        Numero di giorni (intero, non frazionario) entro/decorsi i quali va
        eseguito il pagamento di SOLUZIONE_UNICA_ENTRO/OLTRE. Limite massimo
        di 3650 (10 anni), ampiamente sufficiente per qualsiasi caso reale.
      examples:
        - 5
    NuovaPendenza:
      type: object
      required:
        - idPendenza
        - idTipoPendenza
        - importo
        - voci
      properties:
        idPendenza:
          type: string
          description: >-
            Identificativo della pendenza (rata) nel gestionale proprietario.
            Univoco per idA2A: per un debito con più co-obbligati ogni
            debitore ha le proprie pendenze, quindi il gestionale indica un
            idPendenza diverso per ciascuna.
          examples:
            - abcdef12345
          pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        idTipoPendenza:
          type: string
          description: Identificativo della tipologia pendenza
          examples:
            - IMU
          pattern: '(^[a-zA-Z0-9\-_\.]{1,35}$)'
        causale:
          type: string
          description: >-
            Descrizione della singola pendenza (rata), da mostrare sull'avviso
            di pagamento. Distinta da `descrizione` della posizione debitoria
            (condivisa da tutte le sue pendenze): opzionale, utile quando il
            testo deve differenziarsi per singola rata. Se assente, non viene
            stampato alcun testo specifico della pendenza.
          examples:
            - 'Rata 1 di 3'
          maxLength: 140
        importo:
          type: number
          format: decimal128
          description: Importo della pendenza. Deve corrispondere alla somma delle singole voci.
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        numeroAvviso:
          type: string
          description: >-
            Identificativo univoco versamento. Opzionale: se non fornito,
            viene generato automaticamente da GovPay.
          examples:
            - '123456789012345678'
          pattern: '(^[0-9]{18}$)'
        dataValidita:
          type: string
          format: date
          description: >-
            Data fino alla quale i dati della pendenza sono da considerarsi
            validi e non necessitano di essere attualizzati. Se assente, i
            dati vengono attualizzati a ogni richiesta.
          examples:
            - '2019-12-31'
        dataScadenzaAvviso:
          type: string
          format: date
          description: >-
            Data di scadenza da stampare sull'avviso di pagamento mostrato
            al debitore. Se assente, si usa la data di scadenza dell'opzione
            di pagamento a cui la pendenza appartiene; se anche questa è
            assente, sull'avviso non viene stampata alcuna scadenza.
          examples:
            - '2020-12-15'
        voci:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/NuovaVocePendenza'

    TipoRiferimentoVocePendenza:
      type: string
      description: >-
        Tipo di riferimento di incasso di una voce di pendenza: discrimina
        quale delle 3 forme (RiferimentoEntrata/Entrata/Bollo) si sta
        fornendo o leggendo.
      enum:
        - RIFERIMENTO_ENTRATA
        - ENTRATA
        - BOLLO
      examples:
        - RIFERIMENTO_ENTRATA

    NuovaVocePendenza:
      type: object
      description: >-
        Voce di pendenza. La forma varia in base al tipo di riferimento di
        incasso: `dettaglioContabile` è disponibile solo per
        NuovaVocePendenzaRiferimentoEntrata e NuovaVocePendenzaEntrata; per
        una marca da bollo (NuovaVocePendenzaBollo) la classificazione
        contabile avviene solo tramite `tassonomia`.
      required: [tipoRiferimento]
      properties:
        tipoRiferimento:
          $ref: '#/components/schemas/TipoRiferimentoVocePendenza'
      oneOf:
        - $ref: '#/components/schemas/NuovaVocePendenzaRiferimentoEntrata'
        - $ref: '#/components/schemas/NuovaVocePendenzaEntrata'
        - $ref: '#/components/schemas/NuovaVocePendenzaBollo'
      discriminator:
        propertyName: tipoRiferimento
        mapping:
          RIFERIMENTO_ENTRATA: '#/components/schemas/NuovaVocePendenzaRiferimentoEntrata'
          ENTRATA: '#/components/schemas/NuovaVocePendenzaEntrata'
          BOLLO: '#/components/schemas/NuovaVocePendenzaBollo'

    DatiComuniVocePendenza:
      type: object
      required:
        - idVocePendenza
        - importo
        - descrizione
      properties:
        idVocePendenza:
          type: string
          description: Identificativo della voce di pedenza nel gestionale proprietario
          examples:
            - abcdef12345_1
          minLength: 1
          maxLength: 35
        importo:
          type: number
          format: decimal128
          description: Importo della voce
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        descrizione:
          type: string
          description: descrizione della voce di pagamento
          examples:
            - 'Sanzione CdS n. abc00000'
          minLength: 1
          maxLength: 140
        idDominio:
          type: string
          description: Identificativo del dominio creditore
          examples:
            - '1234567890'
          minLength: 1
          maxLength: 35
          pattern: '(^([0-9]){11}$)'

    NuovaVocePendenzaRiferimentoEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/RiferimentoEntrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenza'
        - type: object
          required: [tipoRiferimento]
          properties:
            tipoRiferimento:
              $ref: '#/components/schemas/TipoRiferimentoVocePendenza'
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile per il transfer
                generato da questa voce, secondo il Dizionario dei metadata
                pagoPA (sezione "Riconciliazione contabile"). Solo le
                tipologie catalogate sono accettate in scrittura.
              items:
                $ref: '#/components/schemas/dettaglio'

    NuovaVocePendenzaEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/Entrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenza'
        - type: object
          required: [tipoRiferimento]
          properties:
            tipoRiferimento:
              $ref: '#/components/schemas/TipoRiferimentoVocePendenza'
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile per il transfer
                generato da questa voce, secondo il Dizionario dei metadata
                pagoPA (sezione "Riconciliazione contabile"). Solo le
                tipologie catalogate sono accettate in scrittura.
              items:
                $ref: '#/components/schemas/dettaglio'

    NuovaVocePendenzaBollo:
      type: object
      description: >-
        Nessuna proprietà `dettaglioContabile`: per il bollo la
        classificazione avviene solo tramite `tassonomia` (vedi schema Bollo).
      allOf:
        - $ref: '#/components/schemas/Bollo'
        - $ref: '#/components/schemas/DatiComuniVocePendenza'
        - type: object
          required: [tipoRiferimento]
          properties:
            tipoRiferimento:
              $ref: '#/components/schemas/TipoRiferimentoVocePendenza'

    # ============================================================
    # POSIZIONE DEBITORIA - LETTURA
    # ============================================================

    PosizioneDebitoriaIndex:
      type: object
      required:
        - idA2A
        - idPosizioneDebitoria
        - idDominio
        - descrizione
      properties:
        idA2A:
          type: string
          description: Identificativo del gestionale responsabile della posizione debitoria
          examples:
            - A2A-12345
        idPosizioneDebitoria:
          type: string
          description: >-
            Identificativo pubblico della posizione debitoria: l'IUPD
            (standard pagoPA GPD), calcolato da GovPay concatenando, senza
            separatore, idA2A+idDominio+codDocumento (idDominio sempre
            esattamente 11 cifre). Usato nel path di questa e delle altre
            risorse della posizione. Non è un valore scelto dal chiamante:
            vedi `codDocumento` nello schema di creazione.
          examples:
            - A2A-1234501234567890abcdef12345
          maxLength: 81
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore. Anagrafica consultabile su
            `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
        idUnitaOperativa:
          type: string
          description: >-
            Identificativo dell'unità operativa, se presente. Anagrafica
            consultabile su `GET /domini/{idDominio}/unita-operative/{idUnitaOperativa}`.
          examples:
            - UO33132
        descrizione:
          type: string
          examples:
            - 'Sanzione CdS n. abc00000'
        dataPubblicazione:
          type: string
          format: date

    PosizioneDebitoria:
      description: >-
        Dettaglio completo di una posizione debitoria, comprensivo di tutte
        le sue opzioni di pagamento e delle pendenze che le compongono.
      type: object
      required:
        - idA2A
        - idPosizioneDebitoria
        - idDominio
        - descrizione
        - debitori
      properties:
        idA2A:
          type: string
          description: Identificativo del gestionale responsabile della posizione debitoria
          examples:
            - A2A-12345
        idPosizioneDebitoria:
          type: string
          description: >-
            Identificativo pubblico della posizione debitoria: l'IUPD
            (standard pagoPA GPD), calcolato da GovPay concatenando, senza
            separatore, idA2A+idDominio+codDocumento (idDominio sempre
            esattamente 11 cifre). Usato nel path di questa e delle altre
            risorse della posizione. Non è un valore scelto dal chiamante:
            vedi `codDocumento` nello schema di creazione.
          examples:
            - A2A-1234501234567890abcdef12345
          maxLength: 81
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore. Anagrafica consultabile su
            `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
        idUnitaOperativa:
          type: string
          description: >-
            Identificativo dell'unità operativa, se presente. Anagrafica
            consultabile su `GET /domini/{idDominio}/unita-operative/{idUnitaOperativa}`.
          examples:
            - UO33132
        descrizione:
          type: string
          examples:
            - 'Sanzione CdS n. abc00000'
        debitori:
          type: array
          description: >-
            Debitori della posizione, ciascuno con la propria notifica SEND
            e le proprie opzioni di pagamento. L'anagrafica di ogni debitore
            compare solo qui.
          minItems: 1
          items:
            $ref: '#/components/schemas/DebitorePosizione'
        dataPubblicazione:
          type: string
          format: date

    DebitorePosizione:
      type: object
      description: >-
        Un debitore della posizione debitoria, con la notifica SEND e le
        opzioni di pagamento che lo riguardano.
      required:
        - soggetto
        - opzioniPagamento
      properties:
        soggetto:
          $ref: '#/components/schemas/Soggetto'
        notificaSend:
          type: boolean
        navNotifica:
          type: string
        opzioniPagamento:
          type: array
          items:
            $ref: '#/components/schemas/OpzionePagamento'

    OpzionePagamentoIndex:
      type: object
      description: >-
        Riferimento all'opzione di pagamento a cui appartiene una pendenza,
        senza l'elenco delle pendenze che la compongono.
      required: [tipologia]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
      oneOf:
        - $ref: '#/components/schemas/OpzionePagamentoIndexPianoRateale'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnica'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaEntro'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaOltre'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaRidotto'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaScontato'
      discriminator:
        propertyName: tipologia
        mapping:
          PIANO_RATEALE: '#/components/schemas/OpzionePagamentoIndexPianoRateale'
          SOLUZIONE_UNICA: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnica'
          SOLUZIONE_UNICA_ENTRO: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaEntro'
          SOLUZIONE_UNICA_OLTRE: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaOltre'
          SOLUZIONE_UNICA_RIDOTTO: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaRidotto'
          SOLUZIONE_UNICA_SCONTATO: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaScontato'

    StatoOpzionePagamento:
      type: string
      description: >-
        Stato dell'opzione di pagamento. Un'opzione nasce DISPONIBILE, cioè
        ancora selezionabile dal debitore. Quando arriva un pagamento su una
        delle sue pendenze, l'opzione passa automaticamente ad ATTIVATA: è
        quella con cui il debitore ha effettivamente pagato. Nello stesso
        momento tutte le altre opzioni della stessa posizione debitoria,
        se ancora DISPONIBILI, passano automaticamente ad ANNULLATA, essendo
        alternative non più applicabili. Un'opzione DISPONIBILE può anche
        essere annullata manualmente tramite PATCH su
        `/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/opzioni-pagamento/{idOpzionePagamento}`
        (`{"op": "replace", "path": "/stato", "value": "ANNULLATA"}`); un'opzione
        già ATTIVATA non può invece essere annullata, perché corrisponde a un
        pagamento già eseguito. ANNULLATA è uno stato definitivo.
      enum:
        - DISPONIBILE
        - ATTIVATA
        - ANNULLATA
      examples:
        - DISPONIBILE
    OpzionePagamentoIndexPianoRateale:
      type: object
      required: [idOpzionePagamento, tipologia, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          description: >-
            Identificativo dell'opzione di pagamento, generato da GovPay
            alla creazione. Usato nel path di
            `PATCH .../opzioni-pagamento/{idOpzionePagamento}`. Stabile per
            tutta la vita della posizione debitoria, indipendentemente da
            eventuali altre opzioni aggiunte in seguito.
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnica:
      type: object
      required: [idOpzionePagamento, tipologia, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnicaEntro:
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnicaOltre:
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnicaRidotto:
      type: object
      required: [idOpzionePagamento, tipologia, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnicaScontato:
      type: object
      required: [idOpzionePagamento, tipologia, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamento:
      type: object
      description: >-
        Vista completa di un'opzione di pagamento, comprensiva delle
        pendenze che la compongono.
      required: [tipologia]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
      oneOf:
        - $ref: '#/components/schemas/OpzionePagamentoPianoRateale'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnica'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnicaEntro'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnicaOltre'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnicaRidotto'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnicaScontato'
      discriminator:
        propertyName: tipologia
        mapping:
          PIANO_RATEALE: '#/components/schemas/OpzionePagamentoPianoRateale'
          SOLUZIONE_UNICA: '#/components/schemas/OpzionePagamentoSoluzioneUnica'
          SOLUZIONE_UNICA_ENTRO: '#/components/schemas/OpzionePagamentoSoluzioneUnicaEntro'
          SOLUZIONE_UNICA_OLTRE: '#/components/schemas/OpzionePagamentoSoluzioneUnicaOltre'
          SOLUZIONE_UNICA_RIDOTTO: '#/components/schemas/OpzionePagamentoSoluzioneUnicaRidotto'
          SOLUZIONE_UNICA_SCONTATO: '#/components/schemas/OpzionePagamentoSoluzioneUnicaScontato'

    OpzionePagamentoPianoRateale:
      description: >-
        Opzione di pagamento a piano rateale, comprensiva delle rate
        (pendenze) che la compongono.
      type: object
      required: [idOpzionePagamento, tipologia, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          description: >-
            Identificativo dell'opzione di pagamento, generato da GovPay
            alla creazione.
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnica:
      description: >-
        Opzione di pagamento in unica soluzione, comprensiva della/e
        pendenza/e che la compongono (più di una solo quando il dovuto
        supera le 5 voci ammesse per un singolo avviso di pagamento).
      type: object
      required: [idOpzionePagamento, tipologia, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnicaEntro:
      description: >-
        Opzione di pagamento in unica soluzione con termine di pagamento
        espresso in giorni, comprensiva della pendenza che la compone.
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnicaOltre:
      description: >-
        Opzione di pagamento in unica soluzione disponibile solo decorso un
        termine espresso in giorni, comprensiva della pendenza che la compone.
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnicaRidotto:
      description: >-
        Sanzione del Codice della Strada in misura ridotta, comprensiva
        della pendenza che la compone. Nessun campo `giorni`.
      type: object
      required: [idOpzionePagamento, tipologia, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnicaScontato:
      description: >-
        Sanzione del Codice della Strada con sconto per pagamento in forma
        agevolata, comprensiva della pendenza che la compone. Nessun campo
        `giorni`.
      type: object
      required: [idOpzionePagamento, tipologia, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    # ============================================================
    # PENDENZA - LETTURA
    # ============================================================

    PendenzaBase:
      type: object
      required:
        - idA2A
        - idPendenza
        - idDominio
        - stato
        - opzionePagamento
        - numeroRata
        - importo
        - iuv
        - numeroAvviso
        - dataCaricamento
      properties:
        idA2A:
          type: string
          description: Identificativo del gestionale responsabile della pendenza
          examples:
            - A2A-12345
        idPendenza:
          type: string
          description: Identificativo della pendenza nel gestionale responsabile
          examples:
            - abcdef12345
        idTipoPendenza:
          type: string
          description: Identificativo della tipologia pendenza
          examples:
            - IMU
        causale:
          type: string
          description: >-
            Descrizione della singola pendenza (rata), se impostata in
            scrittura. Distinta da `descrizione` della posizione debitoria
            (condivisa da tutte le sue pendenze).
          examples:
            - 'Rata 1 di 3'
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore. Anagrafica consultabile su
            `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
        stato:
          $ref: '#/components/schemas/StatoPendenza'
        iuv:
          type: string
          description: Identificativo Univoco di Versamento assegnato alla pendenza.
          examples:
            - '000000000012345'
        dataPagamento:
          type: string
          format: date
          description: Data di pagamento della pendenza
          examples:
            - '2018-12-31'
        opzionePagamento:
          $ref: '#/components/schemas/OpzionePagamentoIndex'
        numeroRata:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Numero di rata della pendenza all'interno della sua opzione di
            pagamento: corrisponde alla posizione (1-based) della pendenza
            nell'array `pendenze` dell'opzione. Per le opzioni SOLUZIONE_UNICA,
            SOLUZIONE_UNICA_ENTRO e SOLUZIONE_UNICA_OLTRE, che hanno
            un'unica pendenza, vale sempre 1. Non richiesto in scrittura: è
            GovPay ad assegnarlo in base all'ordine delle pendenze
            nell'array della relativa opzione di pagamento.
          examples:
            - 1
        importo:
          type: number
          format: decimal128
          description: Importo della pendenza. Deve corrispondere alla somma delle singole voci.
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        numeroAvviso:
          type: string
          description: Identificativo dell'avviso di pagamento pagoPA associato alla pendenza.
          examples:
            - '123456789012345678'
          pattern: '(^[0-9]{18}$)'
        dataCaricamento:
          type: string
          format: date
          description: Data di emissione della pendenza
          examples:
            - '2010-12-31'
        dataValidita:
          type: string
          format: date
          description: >-
            Data fino alla quale i dati della pendenza sono da considerarsi
            validi e non necessitano di essere attualizzati. Se assente, i
            dati vengono attualizzati a ogni richiesta.
          examples:
            - '2019-12-31'
        dataScadenzaAvviso:
          type: string
          format: date
          description: >-
            Data di scadenza da stampare sull'avviso di pagamento mostrato
            al debitore. Se assente, si usa la data di scadenza dell'opzione
            di pagamento a cui la pendenza appartiene; se anche questa è
            assente, sull'avviso non viene stampata alcuna scadenza.
          examples:
            - '2020-12-15'
        speseNotificaSendImporto:
          type: number
          format: decimal128
          readOnly: true
          description: >-
            Importo delle spese di notifica SEND quantificato da GovPay al
            momento del pagamento, quando `notificaSend` è attivo sul
            debitore della pendenza. Assente se non ancora quantificato, o se
            `notificaSend` non è attivo.
          examples:
            - 1.20
        speseNotificaSendDataAggiornamento:
          type: string
          format: date-time
          readOnly: true
          description: >-
            Istante dell'ultima interrogazione che ha prodotto
            `speseNotificaSendImporto`.
          examples:
            - '2026-01-15T10:30:00Z'

    Pendenza:
      type: object
      allOf:
        - $ref: '#/components/schemas/PendenzaBase'
        - type: object
          required:
            - voci
            - posizioneDebitoria
            - debitore
          properties:
            debitore:
              $ref: '#/components/schemas/RiferimentoDebitore'
            voci:
              type: array
              minItems: 1
              maxItems: 5
              items:
                $ref: '#/components/schemas/VocePendenza'
            posizioneDebitoria:
              $ref: '#/components/schemas/PosizioneDebitoriaIndex'

    PendenzaIndex:
      type: object
      allOf:
        - $ref: '#/components/schemas/PendenzaBase'
        - type: object
          required:
            - posizioneDebitoria
            - debitore
          properties:
            posizioneDebitoria:
              $ref: '#/components/schemas/PosizioneDebitoriaIndex'
            debitore:
              $ref: '#/components/schemas/RiferimentoDebitore'

    PendenzaOpzionePagamento:
      type: object
      description: >-
        Pendenza (rata) vista dall'interno della sua opzione di pagamento:
        a differenza di `PendenzaIndex`, non riporta `posizioneDebitoria`,
        già noto da chi la contiene (la posizione debitoria stessa).
      allOf:
        - $ref: '#/components/schemas/PendenzaBase'

    Pendenze:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/PendenzaIndex'

    PosizioniDebitorie:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/PosizioneDebitoriaIndex'

    VocePendenza:
      type: object
      description: >-
        Voce di pendenza in lettura. La forma varia in base al tipo di
        riferimento di incasso: `dettaglioContabile` è disponibile solo per
        VocePendenzaRiferimentoEntrata e VocePendenzaEntrata; per una marca
        da bollo (VocePendenzaBollo) la classificazione contabile risulta
        solo tramite `tassonomia`.
      oneOf:
        - $ref: '#/components/schemas/VocePendenzaRiferimentoEntrata'
        - $ref: '#/components/schemas/VocePendenzaEntrata'
        - $ref: '#/components/schemas/VocePendenzaBollo'

    DatiComuniVocePendenzaLettura:
      type: object
      required:
        - idVocePendenza
        - importo
        - descrizione
        - indice
        - stato
      properties:
        idVocePendenza:
          type: string
          description: Identificativo della voce di pedenza nel gestionale proprietario
          examples:
            - abcdef12345_1
          minLength: 1
          maxLength: 35
        importo:
          type: number
          format: decimal128
          description: Importo della voce
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        descrizione:
          type: string
          description: descrizione della voce di pagamento
          examples:
            - 'Sanzione CdS n. abc00000'
          minLength: 1
          maxLength: 140
        indice:
          type: integer
          format: int32
          description: indice di voce all'interno della pendenza
          examples:
            - 1
          minimum: 1
          maximum: 5
        stato:
          $ref: '#/components/schemas/StatoVocePendenza'
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore di questa voce (se
            diverso da quello della pendenza, caso multi-beneficiario).
            Anagrafica consultabile su `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
    VocePendenzaRiferimentoEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/RiferimentoEntrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenzaLettura'
        - type: object
          properties:
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile letto dai metadata
                della RT/RPT, secondo il Dizionario dei metadata pagoPA.
              items:
                $ref: '#/components/schemas/dettaglioLetto'

    VocePendenzaEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/Entrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenzaLettura'
        - type: object
          properties:
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile letto dai metadata
                della RT/RPT, secondo il Dizionario dei metadata pagoPA.
              items:
                $ref: '#/components/schemas/dettaglioLetto'

    VocePendenzaBollo:
      type: object
      description: >-
        Nessuna proprietà `dettaglioContabile`: per il bollo la
        classificazione avviene solo tramite `tassonomia` (vedi schema Bollo).
      allOf:
        - $ref: '#/components/schemas/Bollo'
        - $ref: '#/components/schemas/DatiComuniVocePendenzaLettura'

    # ============================================================
    # SOGGETTO
    # ============================================================

    RiferimentoDebitore:
      type: object
      description: >-
        Debitore a cui appartiene la pendenza, identificato da tipo e
        identificativo. L'anagrafica completa è in
        `PosizioneDebitoria.debitori[].soggetto`.
      required:
        - tipo
        - identificativo
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSoggetto'
        identificativo:
          type: string
          description: codice fiscale o partita iva del debitore
          examples:
            - RSSMRA30A01H501I

    Soggetto:
      description: dati anagrafici di un versante o pagatore.
      type: object
      required:
        - tipo
        - identificativo
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSoggetto'
        identificativo:
          description: codice fiscale o partita iva del soggetto
          type: string
          examples:
            - RSSMRA30A01H501I
          minLength: 2
          maxLength: 16
        anagrafica:
          description: nome e cognome o altra ragione sociale del soggetto
          type: string
          examples:
            - Mario Rossi
          minLength: 1
          maxLength: 70
        indirizzo:
          type: string
          examples:
            - Piazza della Vittoria
          minLength: 1
          maxLength: 70
        civico:
          type: string
          examples:
            - 10/A
          minLength: 1
          maxLength: 16
        cap:
          type: string
          examples:
            - '00000'
          minLength: 1
          maxLength: 16
        localita:
          type: string
          examples:
            - Roma
          minLength: 1
          maxLength: 35
        provincia:
          type: string
          examples:
            - RM
        nazione:
          type: string
          description: Codice ISO 3166-1 alpha-2 della nazione.
          examples:
            - IT
          pattern: '[A-Z]{2,2}'
        email:
          type: string
          examples:
            - mario.rossi@email.it
        cellulare:
          type: string
          examples:
            - '+39 000-1234567'
          pattern: '\+[0-9]{2}\s[0-9]{3}\-[0-9]{7}'
    TipoSoggetto:
      description: >-
        tipologia di soggetto, se persona fisica (F) o giuridica (G)
      type: string
      enum:
        - G
        - F
      examples:
        - F
    RiferimentoEntrata:
      description: Definisce i dettagli di incasso tramite riferimento in anagrafica GovPay.
      type: object
      required:
        - codEntrata
      properties:
        codEntrata:
          type: string
          examples:
            - SRV-12345
          pattern: '(^[a-zA-Z0-9\-_\.]{1,35}$)'

    Bollo:
      description: >-
        Definisce i dati di un bollo telematico. Non ammette
        `dettaglioContabile` (il Dizionario dei metadata di riconciliazione
        contabile pagoPA non si applica al bollo): la classificazione
        avviene solo tramite `tassonomia`.
      type: object
      required:
        - tipoBollo
        - hashDocumento
        - provinciaResidenza
        - tassonomia
      not:
        required:
          - dettaglioContabile
      properties:
        tipoBollo:
          description: Tipologia di Bollo digitale
          type: string
          enum:
            - '01'
        hashDocumento:
          description: Digest in base64 del documento informatico associato alla marca da bollo
          type: string
          examples:
            - "--- base64 ---"
          maxLength: 70
        provinciaResidenza:
          description: Sigla automobilistica della provincia di residenza del soggetto pagatore
          type: string
          examples:
            - "RO"
          pattern: "[A-Z]{2,2}"
        tassonomia:
          $ref: '#/components/schemas/tassonomia'

    Entrata:
      description: Definisce i dettagli di una entrata.
      type: object
      required:
        - ibanAccredito
        - tassonomia
      properties:
        ibanAccredito:
          type: string
          examples:
            - IT60X0542811101000000123456
          pattern: "[a-zA-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}"
        ibanAppoggio:
          type: string
          examples:
            - IT60X0542811101000000123456
          pattern: "[a-zA-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}"
        tassonomia:
          $ref: '#/components/schemas/tassonomia'

    tassonomia:
      type: string
      description: >-
        Tassonomia dei servizi di incasso pagoPA, secondo la sintassi
        Prefisso/CodiceEC/MacroArea/Tipologia/MotivoGiuridico descritta in
        https://developer.pagopa.it/pago-pa/guides/sanp/ente-creditore/tassonomia-dei-servizi-di-incasso.
        Viene riportata così com'è nel campo `transferCategory` dell'RPT
        verso il Nodo dei Pagamenti. Alcuni clienti usano un ulteriore `/`
        seguito da testo libero, in coda alla sintassi standard, per
        annotarvi informazioni proprie: ammesso, ma non interpretato da
        GovPay.
      examples:
        - '9/0101002IM/'
        - '9/0101002IM//rif.pratica123'
      pattern: '^[6789]/[0-9]{7}(IM|TS|SP|SA|AP)/(/.*)?$'

    # ============================================================
    # DETTAGLIO CONTABILE (issue #877)
    # ============================================================

    TipoDettaglioContabile:
      type: string
      description: >-
        Tipologia di dettaglio di riconciliazione contabile. UNKNOWN_ENTRIES
        è generato solo in lettura (metadata non riconosciuti, prodotti da un
        intermediario/tecnologia terza), non ammesso in scrittura.
      enum:
        - CORRISPETTIVO_DL118
        - INCASSO_TIPICO
        - CIVILISTICO
        - SPESE_NOTIFICA
        - UNKNOWN_ENTRIES
      examples:
        - CIVILISTICO

    dettaglio:
      type: object
      description: >-
        Ogni value prodotto verso pagoPA non può eccedere 140 caratteri
        (spazi compresi), per vincolo del dizionario dei metadata.
        SPESE_NOTIFICA va indicato in scrittura solo se l'importo della
        voce include già le spese di notifica SEND calcolate autonomamente
        dall'applicativo; in tal caso `notificaSend` non va attivato sul
        debitore, altrimenti le spese verrebbero applicate due
        volte.
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
      oneOf:
        - $ref: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
        - $ref: '#/components/schemas/dettaglioContabileIncassoTipico'
        - $ref: '#/components/schemas/dettaglioContabileCivilistico'
        - $ref: '#/components/schemas/dettaglioContabileImportoNotifica'
      discriminator:
        propertyName: tipo
        mapping:
          CORRISPETTIVO_DL118: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
          INCASSO_TIPICO: '#/components/schemas/dettaglioContabileIncassoTipico'
          CIVILISTICO: '#/components/schemas/dettaglioContabileCivilistico'
          SPESE_NOTIFICA: '#/components/schemas/dettaglioContabileImportoNotifica'

    dettaglioLetto:
      type: object
      description: >-
        Variante in lettura di 'dettaglio': oltre alle tipologie ammesse in
        scrittura, include anche UNKNOWN_ENTRIES (metadata non riconosciuti,
        generati da un intermediario/tecnologia terza).
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
      oneOf:
        - $ref: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
        - $ref: '#/components/schemas/dettaglioContabileIncassoTipico'
        - $ref: '#/components/schemas/dettaglioContabileCivilistico'
        - $ref: '#/components/schemas/dettaglioContabileImportoNotifica'
        - $ref: '#/components/schemas/dettaglioContabileSconosciuto'
      discriminator:
        propertyName: tipo
        mapping:
          CORRISPETTIVO_DL118: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
          INCASSO_TIPICO: '#/components/schemas/dettaglioContabileIncassoTipico'
          CIVILISTICO: '#/components/schemas/dettaglioContabileCivilistico'
          SPESE_NOTIFICA: '#/components/schemas/dettaglioContabileImportoNotifica'
          UNKNOWN_ENTRIES: '#/components/schemas/dettaglioContabileSconosciuto'

    dettaglioContabileCorrispettivoDL118:
      type: object
      required: [tipo, annoCompetenza, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        annoCompetenza:
          type: string
          pattern: '^[0-9]{4}$'
          description: Anno di competenza (RC_AC).
          examples:
            - '2026'
        codiceUfficio:
          type: string
          maxLength: 140
          description: Codice ufficio (RC_CU).
        capitolo:
          type: string
          maxLength: 140
          description: >-
            Capitolo di bilancio (RC_CAP). Alternativo ad "accertamento" e a
            "pianoFinanziario5Livello": deve essere presente uno dei tre.
        accertamento:
          type: string
          maxLength: 140
          description: >-
            Accertamento (RC_ACC), es. "2023/1233". Alternativo a "capitolo"
            e a "pianoFinanziario5Livello".
        articolo:
          type: string
          maxLength: 140
          description: Articolo di bilancio (RC_ART).
        pianoFinanziario5Livello:
          type: string
          maxLength: 140
          description: Piano finanziario 5° livello (RC_PF5).
          examples:
            - 'E.1.01.01.20.001'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio (RC_IMP).

    dettaglioContabileIncassoTipico:
      type: object
      required: [tipo, annoCompetenza, tipoIncasso, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        annoCompetenza:
          type: string
          pattern: '^[0-9]{4}$'
          description: Anno di competenza (RC_AC).
        codiceUfficio:
          type: string
          maxLength: 140
          description: Codice ufficio (RC_CU).
        tipoIncasso:
          type: string
          maxLength: 140
          description: Tipo incasso / voce economica (RC_TI).
          examples:
            - 'DIRITTI DI SEGRETERIA'
        emissioneFattura:
          type: string
          enum: [SI, NO]
          description: 'Emissione fattura (RC_EF). Alternativo a "nrDocumento".'
        nrDocumento:
          type: string
          maxLength: 140
          description: 'Numero documento (RC_ND). Alternativo a "emissioneFattura".'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio (RC_IMP).

    dettaglioContabileCivilistico:
      type: object
      required: [tipo, annoCompetenza, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        annoCompetenza:
          type: string
          pattern: '^[0-9]{4}$'
          description: Anno di competenza (RC_AC).
        codiceUfficio:
          type: string
          maxLength: 140
          description: Codice ufficio (RC_CU).
        conto:
          type: string
          maxLength: 140
          description: >-
            Conto (RC_CON), es. "14.01.03". Alternativo a "commessa" e
            "nrDocumento": uno dei tre deve essere presente.
        commessa:
          type: string
          maxLength: 140
          description: 'Commessa (RC_COM). Alternativo a "conto" e "nrDocumento".'
        nrDocumento:
          type: string
          maxLength: 140
          description: 'Numero documento (RC_ND). Alternativo a "conto" e "commessa".'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio (RC_IMP).

    dettaglioContabileImportoNotifica:
      type: object
      description: >-
        Corrisponde alla sezione "Spese di notifica SEND" del Dizionario
        dei metadata pagoPA. In lettura è normalmente generato da GovPay
        stesso, quando `notificaSend` è attivo sul debitore.
        Può essere indicato anche in scrittura dall'applicativo, ma solo
        nel caso in cui l'importo della voce includa già tali spese
        calcolate autonomamente (vedi `dettaglio`).
      required: [tipo, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio.

    dettaglioContabileSconosciuto:
      type: object
      description: >-
        Fallback per metadata che non corrispondono a nessuna delle
        tipologie catalogate: presente solo se generato da un altro
        intermediario/tecnologia terza, non da GovPay in scrittura.
      required: [tipo, entries]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [chiave, valore]
            properties:
              chiave:
                type: string
              valore:
                type: string

    # ============================================================
    # RICEVUTE
    # ============================================================

    Ricevute:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/RicevutaIndex'

    RicevutaIndex:
      type: object
      description: >-
        Riferimento a una ricevuta di pagamento (RT) emessa da pagoPA per
        la pendenza. Il contenuto della ricevuta si recupera tramite
        `GET /pendenze/{idA2A}/{idPendenza}/ricevute/{iur}`.
      required:
        - iur
        - tipo
        - data
      properties:
        iur:
          type: string
          description: Identificativo univoco di riscossione.
          examples:
            - '1234acdc'
        tipo:
          $ref: '#/components/schemas/TipoRicevuta'
        data:
          type: string
          format: date-time
          description: Data di acquisizione della ricevuta.
          examples:
            - '2020-12-31T12:55:12Z'

    TipoRicevuta:
      type: string
      description: >-
        Formato XML della ricevuta: `ctRicevutaTelematica` è il formato
        SANP storico, `ctReceipt` e `ctReceiptV2` sono i formati più
        recenti del Nodo dei Pagamenti.
      enum:
        - ctRicevutaTelematica
        - ctReceipt
        - ctReceiptV2
      examples:
        - ctReceiptV2

    Ricevuta:
      type: object
      description: >-
        Ricevuta di pagamento (RT) originale emessa da pagoPA. La forma
        varia in base al campo `tipo`, che identifica il formato XML
        pagoPA da cui la ricevuta è stata convertita: ciascun formato ha
        i propri campi.
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoRicevuta'
      oneOf:
        - $ref: '#/components/schemas/RicevutaCtRicevutaTelematica'
        - $ref: '#/components/schemas/RicevutaCtReceipt'
        - $ref: '#/components/schemas/RicevutaCtReceiptV2'
      discriminator:
        propertyName: tipo
        mapping:
          ctRicevutaTelematica: '#/components/schemas/RicevutaCtRicevutaTelematica'
          ctReceipt: '#/components/schemas/RicevutaCtReceipt'
          ctReceiptV2: '#/components/schemas/RicevutaCtReceiptV2'

    # --- ctRicevutaTelematica (formato SANP storico) ---

    TipoIdentificativoUnivocoRT:
      description: >-
        Natura del codice che identifica il soggetto in una ricevuta ctRicevutaTelematica
        (SANP 2.3.0): F persona fisica, G persona giuridica (soggetto versante/pagatore o
        ente beneficiario), A codice ABI, B codice BIC (istituto attestante — qui la natura
        del codice e il tipo di soggetto, non sovrapponibile a TipoSoggetto, che modella solo
        persona fisica/giuridica).
      type: string
      enum:
        - F
        - G
        - A
        - B
      examples:
        - G

    RTIdentificativoUnivoco:
      type: object
      required:
        - tipoIdentificativoUnivoco
        - codiceIdentificativoUnivoco
      properties:
        tipoIdentificativoUnivoco:
          $ref: '#/components/schemas/TipoIdentificativoUnivocoRT'
        codiceIdentificativoUnivoco:
          type: string

    RTAnagrafica:
      type: object
      description: >-
        Anagrafica di un soggetto (versante, pagatore, ente beneficiario o
        istituto attestante) come riportata nella ricevuta
        `ctRicevutaTelematica`.
      required:
        - identificativoUnivoco
        - denominazione
      properties:
        identificativoUnivoco:
          $ref: '#/components/schemas/RTIdentificativoUnivoco'
        denominazione:
          type: string
          description: Nominativo o ragione sociale del soggetto.
        codiceUnitaOperativa:
          type: string
        denominazioneUnitaOperativa:
          type: string
        indirizzo:
          type: string
        civico:
          type: string
        cap:
          type: string
        localita:
          type: string
        provincia:
          type: string
        nazione:
          type: string
          description: Codice ISO 3166-1 alpha-2 della nazione, come riportato da pagoPA.
        email:
          type: string

    RTAllegatoRicevuta:
      type: object
      required:
        - tipoAllegatoRicevuta
        - testoAllegato
      properties:
        tipoAllegatoRicevuta:
          type: string
          description: Tipo dell'allegato trasportato con la ricevuta.
        testoAllegato:
          type: string
          format: byte
          description: Contenuto dell'allegato, codificato in base64.

    RTDatiSingoloPagamento:
      type: object
      required:
        - singoloImportoPagato
        - dataEsitoSingoloPagamento
        - identificativoUnivocoRiscossione
        - causaleVersamento
        - datiSpecificiRiscossione
      properties:
        singoloImportoPagato:
          type: number
          format: decimal128
          description: Importo versato. Se il pagamento non è stato eseguito, vale 0.00.
        esitoSingoloPagamento:
          type: string
          description: >-
            Descrizione testuale dell'esito del singolo pagamento.
            Presente se `singoloImportoPagato` vale 0.00.
        dataEsitoSingoloPagamento:
          type: string
          format: date
        identificativoUnivocoRiscossione:
          type: string
        causaleVersamento:
          type: string
        datiSpecificiRiscossione:
          type: string
          description: >-
            Imputazione della specifica entrata, nella forma
            "tipo contabilità"/"codice contabilità".
        commissioniApplicatePSP:
          type: number
          format: decimal128
        commissioniApplicatePA:
          type: number
          format: decimal128
        allegatoRicevuta:
          $ref: '#/components/schemas/RTAllegatoRicevuta'

    RicevutaCtRicevutaTelematica:
      type: object
      description: Ricevuta nel formato XML SANP storico `ctRicevutaTelematica`.
      required:
        - tipo
        - versioneOggetto
        - dominio
        - identificativoMessaggioRicevuta
        - dataOraMessaggioRicevuta
        - riferimentoMessaggioRichiesta
        - riferimentoDataRichiesta
        - istitutoAttestante
        - enteBeneficiario
        - soggettoPagatore
        - datiPagamento
      properties:
        tipo:
          $ref: '#/components/schemas/TipoRicevuta'
        versioneOggetto:
          type: string
        dominio:
          type: object
          required:
            - identificativoDominio
          properties:
            identificativoDominio:
              type: string
            identificativoStazioneRichiedente:
              type: string
        identificativoMessaggioRicevuta:
          type: string
        dataOraMessaggioRicevuta:
          type: string
          format: date-time
        riferimentoMessaggioRichiesta:
          type: string
        riferimentoDataRichiesta:
          type: string
          format: date
        istitutoAttestante:
          $ref: '#/components/schemas/RTAnagrafica'
        enteBeneficiario:
          $ref: '#/components/schemas/RTAnagrafica'
        soggettoVersante:
          $ref: '#/components/schemas/RTAnagrafica'
        soggettoPagatore:
          $ref: '#/components/schemas/RTAnagrafica'
        datiPagamento:
          type: object
          required:
            - codiceEsitoPagamento
            - importoTotalePagato
            - identificativoUnivocoVersamento
            - codiceContestoPagamento
          properties:
            codiceEsitoPagamento:
              type: integer
              format: int32
              description: >-
                Esito del pagamento. Resta numerico perché riporta tale e quale il
                campo `codiceEsitoPagamento` della ricevuta telematica (paSendRT):
                 * 0 = Pagamento eseguito
                 * 1 = Pagamento non eseguito
                 * 2 = Pagamento parzialmente eseguito
                 * 3 = Decorrenza termini
                 * 4 = Decorrenza termini parziale
              enum:
                - 0
                - 1
                - 2
                - 3
                - 4
            importoTotalePagato:
              type: number
              format: decimal128
            identificativoUnivocoVersamento:
              type: string
            codiceContestoPagamento:
              type: string
            datiSingoloPagamento:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RTDatiSingoloPagamento'

    # --- ctReceipt / ctReceiptV2 (formati recenti del Nodo dei Pagamenti) ---
    # I nomi dei campi riportano tali e quali quelli del tracciato pagoPA
    # (PSPCompanyName, IBAN, MBDAttachment in PascalCase): deroga motivata a
    # RAC_GEN_NAME_002, vedi info.description.

    RTMetadata:
      type: array
      description: Metadata pagoPA associati (Dizionario dei metadata).
      items:
        $ref: '#/components/schemas/RTMetadataEntry'

    RTMetadataEntry:
      type: object
      required:
        - chiave
        - valore
      properties:
        chiave:
          type: string
        valore:
          type: string

    RTSubject:
      type: object
      required:
        - uniqueIdentifier
        - fullName
      properties:
        uniqueIdentifier:
          type: object
          required:
            - entityUniqueIdentifierType
            - entityUniqueIdentifierValue
          properties:
            entityUniqueIdentifierType:
              $ref: '#/components/schemas/TipoSoggetto'
            entityUniqueIdentifierValue:
              type: string
        fullName:
          type: string
        streetName:
          type: string
        civicNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        stateProvinceRegion:
          type: string
        country:
          type: string
          description: Codice ISO 3166-1 alpha-2 della nazione, come riportato da pagoPA.
        email:
          type: string

    RTTransfer:
      type: object
      description: Transfer secondo il formato `ctReceipt`.
      required:
        - idTransfer
        - transferAmount
        - fiscalCodePA
        - IBAN
        - remittanceInformation
        - transferCategory
      properties:
        idTransfer:
          type: string
        transferAmount:
          type: number
          format: decimal128
        fiscalCodePA:
          type: string
        IBAN:
          type: string
        remittanceInformation:
          type: string
        transferCategory:
          type: string
        metadata:
          $ref: '#/components/schemas/RTMetadata'

    RTTransferV2:
      type: object
      description: Transfer secondo il formato `ctReceiptV2`.
      required:
        - idTransfer
        - transferAmount
        - fiscalCodePA
        - remittanceInformation
        - transferCategory
      properties:
        idTransfer:
          type: string
        transferAmount:
          type: number
          format: decimal128
        fiscalCodePA:
          type: string
        companyName:
          type: string
        IBAN:
          type: string
          description: Alternativo a `MBDAttachment`. Esattamente uno dei due è presente.
        MBDAttachment:
          type: string
          format: byte
          description: Alternativo a `IBAN`, codificato in base64. Esattamente uno dei due è presente.
        remittanceInformation:
          type: string
        transferCategory:
          type: string
        metadata:
          $ref: '#/components/schemas/RTMetadata'

    RTReceiptBase:
      type: object
      description: Campi comuni a `ctReceipt` e `ctReceiptV2`, esclusi `tipo` e `transferList`.
      required:
        - receiptId
        - noticeNumber
        - fiscalCode
        - outcome
        - creditorReferenceId
        - paymentAmount
        - description
        - companyName
        - debtor
        - idPSP
        - PSPCompanyName
        - idChannel
        - channelDescription
      properties:
        receiptId:
          type: string
        noticeNumber:
          type: string
        fiscalCode:
          type: string
        outcome:
          type: string
          enum:
            - OK
            - KO
        creditorReferenceId:
          type: string
        paymentAmount:
          type: number
          format: decimal128
        description:
          type: string
        companyName:
          type: string
        officeName:
          type: string
        debtor:
          $ref: '#/components/schemas/RTSubject'
        idPSP:
          type: string
        pspFiscalCode:
          type: string
        pspPartitaIVA:
          type: string
        PSPCompanyName:
          type: string
        idChannel:
          type: string
        channelDescription:
          type: string
        payer:
          $ref: '#/components/schemas/RTSubject'
        paymentMethod:
          type: string
        fee:
          type: number
          format: decimal128
        paymentDateTime:
          type: string
          format: date-time
        applicationDate:
          type: string
          format: date
        transferDate:
          type: string
          format: date
        metadata:
          $ref: '#/components/schemas/RTMetadata'
        standIn:
          type: boolean

    RicevutaCtReceipt:
      type: object
      description: Ricevuta nel formato `ctReceipt` del Nodo dei Pagamenti.
      allOf:
        - $ref: '#/components/schemas/RTReceiptBase'
        - type: object
          required:
            - tipo
            - transferList
          properties:
            tipo:
              $ref: '#/components/schemas/TipoRicevuta'
            transferList:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RTTransfer'

    RicevutaCtReceiptV2:
      type: object
      description: Ricevuta nel formato `ctReceiptV2` del Nodo dei Pagamenti.
      allOf:
        - $ref: '#/components/schemas/RTReceiptBase'
        - type: object
          required:
            - tipo
            - transferList
          properties:
            tipo:
              $ref: '#/components/schemas/TipoRicevuta'
            transferList:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RTTransferV2'
            paymentNote:
              type: string
            primaryCiIncurredFee:
              type: number
              format: decimal128
            idBundle:
              type: string
            idCiBundle:
              type: string

    # ============================================================
    # RENDICONTAZIONI
    # ============================================================

    Rendicontazioni:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Rendicontazione'

    Rendicontazione:
      type: object
      description: >-
        Occorrenza di pagamento della pendenza all'interno di un flusso di
        rendicontazione ricevuto da pagoPA.
      required:
        - iuv
        - iur
        - importo
        - esito
        - data
        - stato
        - flusso
      properties:
        iuv:
          type: string
          description: Identificativo univoco di versamento.
          examples:
            - '01000000202012345'
        iur:
          type: string
          description: Identificativo univoco di riscossione.
          examples:
            - '1234acdc'
        indice:
          type: integer
          format: int32
          description: >-
            Indice dell'occorrenza del pagamento all'interno della
            struttura `datiSingoloPagamento` della ricevuta telematica.
          examples:
            - 1
        importo:
          type: number
          format: decimal128
          description: Importo rendicontato.
          examples:
            - 10.01
        esito:
          type: string
          description: >-
            Esito dell'operazione rendicontata, con i valori di `payStatus` del flusso
            di rendicontazione pagoPA (tra parentesi il codice numerico del tracciato):
             * EXECUTED = Pagamento eseguito (0)
             * REVOKED = Pagamento revocato (3)
             * STAND_IN = Pagamento eseguito in standin (4)
             * STAND_IN_NO_RPT = Pagamento eseguito in standin, in assenza di RPT (8)
             * NO_RPT = Pagamento eseguito in assenza di RPT (9)
          enum:
            - EXECUTED
            - REVOKED
            - STAND_IN
            - STAND_IN_NO_RPT
            - NO_RPT
          examples:
            - EXECUTED
        data:
          type: string
          format: date
          description: Data di esito.
          examples:
            - '2018-12-31'
        stato:
          $ref: '#/components/schemas/StatoRendicontazione'
        flusso:
          $ref: '#/components/schemas/FlussoRendicontazione'

    StatoRendicontazione:
      description: Stato della rendicontazione.
      type: string
      enum:
        - OK
        - ANOMALA
        - ALTRO_INTERMEDIARIO
      examples:
        - OK

    FlussoRendicontazione:
      type: object
      description: Dati di testata del flusso di rendicontazione.
      required:
        - idFlusso
        - dataFlusso
        - trn
        - dataRegolamento
        - idPsp
        - numeroPagamenti
        - importoTotale
        - stato
      properties:
        idFlusso:
          type: string
          description: Identificativo del flusso di rendicontazione.
          examples:
            - '2017-11-21GovPAYPsp1-10:27:27.903'
        dataFlusso:
          type: string
          format: date-time
          description: Data di emissione del flusso.
          examples:
            - '2020-12-31T10:27:27.903Z'
        trn:
          type: string
          description: >-
            Identificativo dell'operazione di riversamento assegnato dal
            PSP debitore.
          examples:
            - idriversamento12345
        dataRegolamento:
          type: string
          format: date-time
          description: Data dell'operazione di riversamento fondi.
          examples:
            - '2020-12-31T10:27:27.903Z'
        idPsp:
          type: string
          description: Identificativo dell'istituto mittente.
          examples:
            - ABI-12345
        bicRiversamento:
          type: string
          description: Codice BIC della banca che ha generato il riversamento.
          examples:
            - BIC-12345
        numeroPagamenti:
          type: integer
          format: int64
          description: Numero di pagamenti oggetto della rendicontazione.
          examples:
            - 3
        importoTotale:
          type: number
          format: double
          description: Somma degli importi rendicontati.
          examples:
            - 100.01
        stato:
          $ref: '#/components/schemas/StatoFlussoRendicontazione'

    StatoFlussoRendicontazione:
      description: >-
        Stato del flusso di rendicontazione, allineato 1:1 ai valori legacy
        di `fr.stato` (stessa colonna condivisa da v2 e v3).
      type: string
      enum:
        - ACCETTATA
        - ANOMALA
        - RIFIUTATA
      examples:
        - ACCETTATA

    StatoPendenza:
      description: >-
        Stato della pendenza, allineato 1:1 ai valori legacy di
        `versamenti.stato_versamento` (stessa colonna condivisa da v2 e v3).
        Non esiste uno stato "scaduta": la pagabilità dipende da
        `dataScadenza` dell'opzione di pagamento (o da `dataScadenzaAvviso`
        della pendenza, in sua assenza), calcolata a runtime, non uno stato
        persistito.
      examples:
        - NON_ESEGUITO
      type: string
      enum:
        - NON_ESEGUITO
        - ESEGUITO
        - PARZIALMENTE_ESEGUITO
        - ANNULLATO
        - ESEGUITO_ALTRO_CANALE
        - ANOMALO
        - ESEGUITO_SENZA_RPT
        - INCASSATO

    StatoVocePendenza:
      type: string
      description: >-
        Stato della voce di pagamento. NON_ESEGUITO/ESEGUITO coincidono per
        stringa con lo stato legacy di `singoli_versamenti`; ANOMALO è un
        valore proprio di v3, senza equivalente legacy.
      enum:
        - NON_ESEGUITO
        - ESEGUITO
        - ANOMALO
      examples:
        - NON_ESEGUITO

    LinguaSecondaria:
      description: >-
        Lingua secondaria dell'avviso bilingue, come codice ISO 639-1. Se assente,
        l'avviso è solo in italiano.
      examples:
        - 'en'
      type: string
      enum:
        - 'de'
        - 'en'
        - 'fr'
        - 'sl'

    PersonalizzazioneAvviso:
      type: object
      description: >-
        Opzioni di personalizzazione testuale/traduzione dell'avviso di pagamento.
      properties:
        linguaSecondaria:
          $ref: '#/components/schemas/LinguaSecondaria'
        causaleTradotta:
          type: string
          description: >-
            Causale della pendenza tradotta nella lingua secondaria, da inserire
            nell'avviso.
        informativaImporto:
          type: string
          maxLength: 255
          description: >-
            Se valorizzato, sostituisce il testo standard della nota informativa
            sull'importo. Se valorizzato con stringa vuota, l'informativa viene
            omessa.
        informativaImportoTradotta:
          type: string
          maxLength: 255
          description: Versione tradotta di `informativaImporto`, nella lingua secondaria.

    Pagination:
      type: object
      description: >-
        Metadati di paginazione a offset (richiesta con `offset`, o senza
        alcun parametro di paginazione): assenti in modalità cursore
        (richiesta con `cursor`), dove l'unico metadato di paginazione è
        `nextCursor`.
      required:
        - offset
        - limit
        - hasNextPage
      properties:
        offset:
          type: integer
          format: int32
          description: Numero di risultati saltati, usato per produrre questa risposta.
          examples:
            - 0
        limit:
          type: integer
          format: int32
          description: Numero massimo di risultati per pagina usato per produrre questa risposta.
          examples:
            - 25
        hasNextPage:
          type: boolean
          description: Indica se esiste una pagina successiva.
          examples:
            - true
        totalResults:
          type: integer
          format: int32
          description: >-
            Numero totale di risultati che rispettano i filtri di
            ricerca. Presente solo se richiesto con `total=true`.
          examples:
            - 100
        totalPages:
          type: integer
          format: int32
          description: >-
            Numero totale di pagine, calcolato da `totalResults` e
            `limit`. Presente solo se richiesto con `total=true`.
          examples:
            - 4

    PaginatedResponse:
      type: object
      description: >-
        Busta generica di risposta per un elenco paginato, specializzata
        per singola risorsa tramite `allOf` con l'array `results`
        tipizzato. Riporta `pagination` in modalità a offset, `nextCursor`
        in modalità a cursore (vedi parametri `offset`/`cursor`): mai
        entrambi, e nessuno dei due se non esistono altri
        risultati/pagine.
      required:
        - results
      properties:
        results:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'
        nextCursor:
          type: string
          description: >-
            Cursore opaco da passare come parametro `cursor` per ottenere
            la pagina successiva, in modalità cursore. Assente se non
            esistono altri risultati.

    Limit:
      type: integer
      format: int32
      default: 25
      maximum: 200

    PatchOp:
      type: object
      description: >-
        Singola operazione JSON Patch (RFC 6902). Sottoinsieme supportato:
        add/remove/replace (non supportati move/copy/test).
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
          description: Operazione da eseguire.
          examples:
            - replace
        path:
          type: string
          description: JSON Pointer (RFC 6901) del campo su cui operare.
          examples:
            - "/stato"
        value:
          description: >-
            Nuovo valore. Obbligatorio per `add`/`replace`, assente per
            `remove`. Può essere di qualsiasi tipo JSON (stringa, numero,
            booleano, oggetto, array), non solo oggetto.
          examples:
            - "ANNULLATA"
    # ============================================================
    # ERRORI
    # ============================================================

    Problem:
      type: object
      description: >-
        Descrizione di un errore in formato "Problem Details for HTTP APIs"
        (RFC 7807), come previsto dalle Linee guida di interoperabilità
        AGID. Restituito con Content-Type `application/problem+json`.
        `title` riporta la reason phrase HTTP dello status, `detail` la
        spiegazione del singolo errore.
      required:
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            URI che identifica il tipo di errore GovPay, puntando alla
            pagina del manuale che lo documenta: l'ultimo segmento del path
            è il codice errore, da cui è univocamente ricavabile anche la
            relativa categoria (consultando la stessa pagina). Se assente,
            equivale a "about:blank", cioè il problema non ha semantica
            oltre quella del codice di stato HTTP.
          examples:
            - 'https://govpay.readthedocs.io/it/latest/manuale/errori/PPT_CANALE_IRRAGGIUNGIBILE'
        title:
          type: string
          description: >-
            Riassunto sintetico e leggibile del tipo di problema, invariato
            tra le diverse occorrenze dello stesso `type`: coincide con la
            reason phrase HTTP dello status.
          examples:
            - Bad Request
        status:
          type: integer
          format: int32
          description: Codice di stato HTTP di questa occorrenza del problema.
          examples:
            - 400
        detail:
          type: string
          description: >-
            Spiegazione specifica di questa occorrenza del problema, utile
            al debug (non è detto sia adatta a essere mostrata all'utente
            finale).
          examples:
            - "Il campo 'importo' non può essere negativo"
        instance:
          type: string
          format: uri
          description: Identificatore URI di questa specifica occorrenza del problema.


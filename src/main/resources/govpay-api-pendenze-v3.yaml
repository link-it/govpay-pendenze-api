        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/debitori/{identificativoDebitore}':
    patch:
      tags:
        - PosizioniDebitorie
      summary: Aggiornamento dei dati di un debitore di una posizione debitoria
      operationId: updateDebitore
      description: >-
        Aggiorna anagrafica e notifica SEND di un debitore, con JSON Patch
        (RFC 6902) sui campi di `DebitorePosizione`: `/soggetto/tipo`,
        `/soggetto/identificativo`, `/soggetto/anagrafica`,
        `/soggetto/indirizzo`, `/soggetto/civico`, `/soggetto/cap`,
        `/soggetto/localita`, `/soggetto/provincia`, `/soggetto/nazione`,
        `/soggetto/email`, `/soggetto/cellulare`, `/notificaSend`,
        `/navNotifica`. `tipo`, `identificativo` e `notificaSend` non si
        rimuovono. Il nuovo `identificativo` deve restare univoco tra i
        debitori della posizione. Se `notificaSend` è attivo, `navNotifica` è
        obbligatorio e deve corrispondere al `numeroAvviso` di una pendenza
        del debitore. Un debitore rimosso non si aggiorna (404). Le opzioni di
        pagamento non si aggiornano qui.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
        - in: path
          name: identificativoDebitore
          description: >-
            Identificativo (codice fiscale o partita iva) del debitore, come in
            `PosizioneDebitoria.debitori[].soggetto.identificativo`.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 35
      requestBody:
        required: true
        content:
          application/json-patch+json;charset=UTF-8:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOp'
              description: Lista di operazioni JSON Patch (RFC 6902) da applicare
      responses:
        '200':
          description: Debitore aggiornato; la risposta riporta il suo stato attuale
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/DebitorePosizione'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            La posizione debitoria è stata modificata concorrentemente da
            un'altra richiesta: rileggerla e riprovare.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
    delete:
      tags:
        - PosizioniDebitorie
      summary: Rimozione di un debitore da una posizione debitoria
      operationId: deleteDebitore
      description: >-
        Rimuove logicamente un debitore: le sue opzioni di pagamento diventano
        ANNULLATA e le sue pendenze ANNULLATO, e il debitore non compare più
        nella posizione né nelle ricerche. L'annullamento è comunicato ad ACA
        come per qualunque annullamento. Le pendenze restano leggibili per
        `idPendenza` con stato ANNULLATO e il loro `idPendenza` e
        `numeroAvviso` non si possono riusare. Rifiutata (409) se il debitore
        è l'unico della posizione, o se nella posizione c'è un'opzione di
        pagamento ATTIVATA o una pendenza eseguita (pagamento già registrato).
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
        - in: path
          name: identificativoDebitore
          description: >-
            Identificativo (codice fiscale o partita iva) del debitore, come in
            `PosizioneDebitoria.debitori[].soggetto.identificativo`.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 35
      responses:
        '204':
          description: Debitore rimosso
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            Il debitore è l'unico della posizione, la posizione ha un
            pagamento già registrato, o è stata modificata concorrentemente.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/stampa':
    get:
      tags:
        - PosizioniDebitorie
      summary: Stampa dell'avviso di pagamento di una posizione debitoria
      operationId: getStampaPosizioneDebitoria
      description: >-
        Fornisce la stampa dell'avviso di pagamento della posizione
        debitoria, in formato PDF. Considera solo le opzioni di pagamento
        con almeno una rata ancora pagabile: se ne resta esattamente una,
        l'avviso è quello della sua rata unica o, se ha più rate, quello
        cumulativo delle sue rate (stesso criterio di
        `GET /pendenze/{idA2A}/{idPendenza}/stampa`); se ne restano più
        di una (opzioni alternative, es. "paga tutto" o "paga a rate"
        sullo stesso debito), l'avviso è un unico PDF con una pagina (o
        più pagine, se l'opzione ha più rate) per ciascuna opzione, mai
        condivisa fra due opzioni diverse. Non è disponibile in formato
        bilingue. L'avviso è quello di un solo debitore: se la posizione
        ha più di un debitore, `idDebitore` è obbligatorio (400 in sua
        assenza), perché ogni debitore ha i propri numeri avviso.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
        - in: query
          name: idDebitore
          description: >-
            Identificativo (codice fiscale o partita iva) del debitore di cui
            stampare l'avviso. Obbligatorio se la posizione ha più di un
            debitore.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Avviso di pagamento in formato PDF
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          description: 'Header `Accept` non compatibile con `application/pdf`'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            L'avviso PDF non è generabile per questa posizione debitoria
            (nessuna opzione di pagamento con rate ancora pagabili, Marca
            da Bollo Telematica, o debitore senza anagrafica)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
        '502':
          description: 'Errore di comunicazione con il microservizio `govpay-stampe`'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            Microservizio `govpay-stampe` non configurato
            (`app.stampe.base-url` mancante)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/opzioni-pagamento':
    post:
      tags:
        - PosizioniDebitorie
      summary: Aggiunta di un'opzione di pagamento a una posizione debitoria esistente
      operationId: addOpzionePagamento
      description: >-
        Aggiunge a una posizione debitoria già esistente una nuova opzione
        di pagamento (con le sue pendenze) per ciascun debitore. Il corpo
        indica, per ogni debitore, il suo `identificativoDebitore` e
        l'opzione: devono essere indicati tutti i debitori della posizione,
        ciascuno una sola volta. È rifiutata (400) un'indicazione che non
        copre tutti i debitori, che ne ripete uno o che indica un
        identificativo non appartenente alla posizione.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/NuovaOpzionePagamentoDebitore'
      responses:
        '201':
          description: Opzioni di pagamento create, una per debitore
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpzionePagamento'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            La posizione debitoria ha già un'opzione di pagamento ATTIVATA
            (pagamento già eseguito): non è più possibile aggiungere
            alternative. Oppure una pendenza della nuova opzione ha un
            idPendenza già usato da un'altra pendenza della stessa
            applicazione.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                giaAttivata:
                  summary: La posizione ha già un'opzione ATTIVATA
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      La posizione debitoria ha già un'opzione di pagamento
                      ATTIVATA: non è più possibile aggiungere alternative
                idPendenzaDuplicato:
                  summary: idPendenza già usato da questa applicazione
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      Una pendenza della nuova opzione ha un idPendenza già
                      usato da un'altra pendenza della stessa applicazione
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/opzioni-pagamento/{idOpzionePagamento}':
    patch:
      tags:
        - PosizioniDebitorie
      summary: Aggiornamento dello stato di un'opzione di pagamento
      operationId: updateOpzionePagamento
      description: >-
        Annulla o ripristina un'opzione di pagamento esistente
        (`{"op": "replace", "path": "/stato", "value": "ANNULLATA"}` oppure
        `"DISPONIBILE"`). Non è previsto un DELETE: un'opzione non si
        elimina, si annulla, preservandone la storia. Entrambe le
        transizioni sono consentite solo se l'opzione NON è attualmente
        ATTIVATA: un'opzione già attivata da un pagamento non può essere
        né annullata né ripristinata. L'operazione si riflette anche su
        tutte le pendenze dell'opzione, che assumono lo stesso stato
        (`ANNULLATO`/`NON_ESEGUITO`) della loro opzione.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
        - in: path
          name: idOpzionePagamento
          description: Identificativo dell'opzione di pagamento
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json-patch+json;charset=UTF-8:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOp'
              description: Lista di operazioni JSON Patch (RFC 6902) da applicare
      responses:
        '200':
          description: Opzione di pagamento aggiornata con successo
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            L'opzione di pagamento è già ATTIVATA da un pagamento e non può
            essere annullata né ripristinata
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                annullamento:
                  summary: Annullamento richiesto su un'opzione ATTIVATA
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      L'opzione di pagamento è già ATTIVATA da un pagamento
                      e non può essere annullata
                ripristino:
                  summary: Ripristino richiesto su un'opzione ATTIVATA
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      L'opzione di pagamento è già ATTIVATA da un pagamento
                      e non può essere ripristinata
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/opzioni-pagamento/{idOpzionePagamento}/pendenze':
    post:
      tags:
        - PosizioniDebitorie
      summary: Aggiunta di una pendenza a un'opzione di pagamento esistente
      operationId: addPendenza
      description: >-
        Aggiunge una nuova pendenza a un'opzione di pagamento già
        esistente. Permesso solo se l'opzione è ancora DISPONIBILE, e solo
        per le tipologie che non hanno un limite massimo di pendenze
        (SOLUZIONE_UNICA, PIANO_RATEALE): per SOLUZIONE_UNICA_ENTRO e
        SOLUZIONE_UNICA_OLTRE, che ne ammettono già esattamente una,
        questo endpoint restituisce 400.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: >-
            Identificativo pubblico della posizione debitoria (IUPD standard
            pagoPA GPD: idA2A+idDominio+codDocumento concatenati senza
            separatore) — vedi `PosizioneDebitoria.idPosizioneDebitoria`.
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,81}$)'
        - in: path
          name: idOpzionePagamento
          description: Identificativo dell'opzione di pagamento
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/NuovaPendenza'
      responses:
        '201':
          description: Pendenza creata
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Pendenza'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            L'opzione di pagamento non è DISPONIBILE, oppure la nuova
            pendenza ha un idPendenza già usato da un'altra pendenza della
            stessa applicazione
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                nonDisponibile:
                  summary: L'opzione non è DISPONIBILE
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      l'opzione di pagamento [idOpzionePagamento] è
                      ATTIVATA: si può aggiungere una pendenza solo se
                      DISPONIBILE
                idPendenzaDuplicato:
                  summary: idPendenza già usato da questa applicazione
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      la nuova pendenza ha un idPendenza già usato da
                      un'altra pendenza della stessa applicazione
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  # ============================================================
  # PENDENZE (lettura/aggiornamento puntuale; la creazione passa sempre
  # da un'opzione di pagamento, vedi sopra)
  # ============================================================

  '/pendenze/{idA2A}':
    get:
      tags:
        - Pendenze
      summary: Elenco delle pendenze
      operationId: findPendenze
      description: >-
        Fornisce la lista delle pendenze del gestionale corrispondenti a un
        avviso di pagamento.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - $ref: '#/components/parameters/numeroAvviso'
        - $ref: '#/components/parameters/idDominio'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/total'
      responses:
        '200':
          description: Elenco delle pendenze che rispettano i filtri di ricerca
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Pendenze'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/pendenze/{idA2A}/{idPendenza}':
    put:
      tags:
        - Pendenze
      summary: Aggiornamento di una pendenza
      operationId: updatePendenza
      description: >-
        Sostituisce i dati della pendenza con quelli forniti nel corpo
        della richiesta — stessa struttura dati della creazione
        (`NuovaPendenza`). Permesso solo se lo stato attuale della
        pendenza è NON_ESEGUITO o ANNULLATO: non è possibile aggiornare i
        metadati di una pendenza già eseguita.


        `idPendenza` nel corpo è obbligatorio (stessa struttura dati
        della creazione) e deve coincidere con quello del path.
        `idTipoPendenza` è liberamente modificabile.
        `numeroAvviso`, se già assegnato, non può cambiare (può essere
        indicato di nuovo con lo stesso valore, o omesso).


        `voci` sostituisce l'intero array: le voci esistenti (identificate
        da `idVocePendenza`) possono essere rimosse, purché ne resti
        almeno una, oppure aggiornate negli altri campi (importo,
        descrizione, ecc.); non possono invece cambiare il tributo/IBAN di
        accredito di riferimento. Si possono anche aggiungere voci nuove.


        L'annullamento/ripristino della pendenza non si effettua più qui:
        si usa `PATCH .../opzioni-pagamento/{idOpzionePagamento}` sulla
        sua opzione di pagamento.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPendenza
          description: Identificativo della pendenza
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/NuovaPendenza'
      responses:
        '200':
          description: Pendenza aggiornata con successo
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            La pendenza non è in uno stato che ammette l'aggiornamento
            (deve essere NON_ESEGUITO o ANNULLATO), oppure la richiesta
            cambia `numeroAvviso` già assegnato o il tributo/IBAN di
            accredito di riferimento di una voce esistente
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                statoNonCompatibile:
                  summary: Pendenza in uno stato che non ammette l'aggiornamento
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      la pendenza [idPendenza] è ESEGUITO: può essere
                      aggiornata solo se NON_ESEGUITO o ANNULLATO
                numeroAvvisoModificato:
                  summary: Tentativo di cambiare numeroAvviso già assegnato
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      'numeroAvviso' non può cambiare rispetto
                      all'originale [numeroAvviso]
                riferimentoVoceModificato:
                  summary: Tentativo di cambiare tributo/IBAN di accredito di una voce esistente
                  value:
                    status: 409
                    title: Conflict
                    detail: >-
                      la voce [idVocePendenza] non può cambiare il
                      riferimento (tributo/IBAN di accredito) rispetto
                      all'originale
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
    get:
      tags:
        - Pendenze
      summary: Dettaglio di una pendenza per identificativo
      operationId: getPendenza
      description: >-
        Acquisisce il dettaglio di una pendenza, comprensivo dei dati di
        pagamento, dell'opzione di pagamento e della posizione debitoria a
        cui appartiene.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPendenza
          description: Identificativo della pendenza
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      responses:
        '200':
          description: Informazioni dettagliate della pendenza
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Pendenza'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/pendenze/{idA2A}/{idPendenza}/stampa':
    post:
      tags:
        - Pendenze
      summary: Stampa dell'avviso di una pendenza
      operationId: getStampaPendenza
      description: >-
        Fornisce la stampa dell'avviso di pagamento della pendenza, in
        formato PDF, identificata tramite gli identificativi del
        gestionale (idA2A e idPendenza) invece che tramite numeroAvviso.
        Le opzioni di personalizzazione testuale/traduzione dell'avviso
        (lingua secondaria, testi tradotti) si specificano nel corpo
        della richiesta — POST, non GET, perché sono testo libero: in
        query string andrebbero percent-encoded e sarebbero esposte a
        problemi con caratteri speciali/accentati e a limiti di
        lunghezza dell'URL.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPendenza
          description: Identificativo della pendenza
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      requestBody:
        required: false
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/PersonalizzazioneAvviso'
      responses:
        '200':
          description: Avviso di pagamento in formato PDF
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            Bilinguismo richiesto (`linguaSecondaria`) senza
            `causaleTradotta` nel corpo della richiesta
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          description: 'Header `Accept` non compatibile con `application/pdf`'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '422':
          description: >-
            L'avviso PDF non è generabile per questa pendenza (Marca da
            Bollo Telematica, o debitore senza anagrafica)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
        '502':
          description: 'Errore di comunicazione con il microservizio `govpay-stampe`'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            Microservizio `govpay-stampe` non configurato
            (`app.stampe.base-url` mancante)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Transaction-ID:
              $ref: '#/components/headers/TransactionId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/problem+json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Problem'


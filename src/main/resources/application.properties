# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

# ------------ JSON SERIALIZATION & PRESENTATION-------------------
spring.mvc.date-format=yyyy-MM-dd
spring.mvc.datetime-format=yyyy-MM-dd'T'HH:mm:ssZZZ
spring.mvc.throw-exception-if-no-handler-found=true
spring.jackson.default-property-inclusion=non_absent

server.error.whitelabel.enabled=true

# ------------ DATASOURCE & JPA ------------------
spring.datasource.url=${DATASOURCE_URL:}
spring.datasource.username=${DATASOURCE_USERNAME:}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# ------------ SPRINGDOC OPENAPI ----------------
# A differenza di govpay-console-api (che serve un YAML statico e disattiva lo
# scanning), qui i controller REST reali sono derivati dallo stesso
# govpay-api-pendenze.yaml via openapi-generator: springdoc scansiona i
# controller normalmente, nessuna spec statica da servire in parallelo.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------- OBSERVABILITY (Prometheus) ----------------
# Porta dedicata alle metriche: la porta applicativa non le serve mai.
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=govpay-pendenze-api

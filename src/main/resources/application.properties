# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

# ------------ JSON SERIALIZATION & PRESENTATION-------------------
spring.mvc.date-format=yyyy-MM-dd
spring.mvc.datetime-format=yyyy-MM-dd'T'HH:mm:ssZZZ
spring.mvc.throw-exception-if-no-handler-found=true
spring.jackson.default-property-inclusion=non_absent

server.error.whitelabel.enabled=true

# ------------ LOGGING (govpay-common) ------------------
# Transaction id e correlation id in ogni riga di log, popolati dal
# TransactionIdFilter di govpay-common: il transaction id e' generato a ogni
# richiesta e non e' mai accettato dall'esterno, il correlation id e' letto da
# X-Correlation-ID / X-Request-ID (o generato) ed e' propagato alle chiamate
# downstream. Entrambi sono restituiti al client negli header di risposta.
logging.pattern.level=%5p [%X{transactionId:-},%X{correlationId:-}]

# Livelli di log modificabili a runtime. La sorgente e' la riga log_level
# della tabella configurazione: una modifica scritta li' raggiunge tutti i
# nodi del cluster entro l'intervallo di refresh. /actuator/loggers da solo
# non basta, perche' agisce sul solo nodo interrogato.
govpay.logging.livelli-dinamici.enabled=true
govpay.logging.livelli-dinamici.intervallo-refresh=${LOG_LEVEL_REFRESH_INTERVAL:60s}
govpay.logging.livelli-dinamici.logger-gestiti[0]=it.govpay

# ------------ DATASOURCE & JPA ------------------
spring.datasource.url=${DATASOURCE_URL:}
spring.datasource.username=${DATASOURCE_USERNAME:}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# ------------ SPRINGDOC OPENAPI ----------------
# A differenza di govpay-console-api (che serve un YAML statico e disattiva lo
# scanning), qui i controller REST reali sono derivati dallo stesso
# govpay-api-pendenze.yaml via openapi-generator: springdoc scansiona i
# controller normalmente, nessuna spec statica da servire in parallelo.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ------------ SICUREZZA (govpay-common-auth) ----------------
# Solo BASIC (API M2M come in v2, nessuna UI/sessione): l'applicazione autenticata e'
# risolta da PendenzeGovpayPrincipalLoader (Utenza->Applicazione via idUtenza) e verificata
# contro idA2A dai controller (CurrentApplicazioneService#verificaIdA2A).
govpay.auth.basic.enabled=true
govpay.auth.public-chain.enabled=true
govpay.auth.public-chain.permit-all-paths[0].path=/swagger-ui/**
govpay.auth.public-chain.permit-all-paths[1].path=/swagger-ui.html
govpay.auth.public-chain.permit-all-paths[2].path=/v3/api-docs/**
# Endpoint actuator (scrape Prometheus + health per le probe): il matcher e'
# per path (non per porta), ma sulla porta applicativa gli endpoint actuator
# non sono mappati (404): l'esposizione effettiva avviene solo sulla porta
# management. health anonimo risponde il solo status UP/DOWN (niente
# show-details): il dettaglio diagnostico resta non esposto.
govpay.auth.public-chain.permit-all-paths[3].path=/actuator/prometheus
govpay.auth.public-chain.permit-all-paths[3].methods[0]=GET
govpay.auth.public-chain.permit-all-paths[4].path=/actuator/health
govpay.auth.public-chain.permit-all-paths[4].methods[0]=GET

# -------------- OBSERVABILITY (Prometheus) ----------------
# Porta dedicata alle metriche: la porta applicativa non le serve mai;
# la protezione dell'endpoint di scrape e' demandata alla rete.
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
# 'loggers' e' esposto sulla sola porta management (9090) e consente la modifica
# immediata del livello sul singolo nodo, complementare alla configurazione su
# database che allinea tutto il cluster. E' un endpoint di scrittura e, come
# prometheus, sulla porta management la sua protezione e' demandata alla rete:
# va tenuta su rete interna. Il canale autenticato e autorizzato per ACL resta
# /admin/logging sulla porta applicativa.
management.endpoints.web.exposure.include=health,prometheus,loggers
# Istogrammi (bucket) su latenze server e client: permettono a Prometheus
# di aggregare percentili tra piu' istanze.
# NB: aumenta serie e memoria. Da tenere in considerazione nelle configurazioni in produzione
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
# Bucket esplicito vicino alla soglia SLA pagoPA (2s): permette di calcolare
# la frazione di richieste sotto soglia per confronto diretto, senza
# affidarsi all'interpolazione di histogram_quantile sui bucket di default.
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,2s,5s
management.metrics.tags.application=govpay-pendenze-api

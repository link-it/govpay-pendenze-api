    LinguaSecondaria:
      examples:
        - 'false'
      type: string
      enum:
        - 'false'
        - 'de'
        - 'en'
        - 'fr'
        - 'sl'

    Pagination:
      type: object
      description: >-
        Metadati di paginazione a offset (richiesta con `page`, o senza
        alcun parametro di paginazione): assenti in modalità cursore
        (richiesta con `cursor`), dove l'unico metadato di paginazione è
        `nextCursor`.
      required:
        - page
        - limit
        - hasNextPage
      properties:
        page:
          type: integer
          description: Numero della pagina restituita.
          examples:
            - 1
        limit:
          type: integer
          description: Numero massimo di risultati per pagina usato per produrre questa risposta.
          examples:
            - 25
        hasNextPage:
          type: boolean
          description: Indica se esiste una pagina successiva.
          examples:
            - true
        totalResults:
          type: integer
          description: >-
            Numero totale di risultati che rispettano i filtri di
            ricerca. Presente solo se richiesto con `total=true`.
          examples:
            - 100
        totalPages:
          type: integer
          description: >-
            Numero totale di pagine, calcolato da `totalResults` e
            `limit`. Presente solo se richiesto con `total=true`.
          examples:
            - 4

    PaginatedResponse:
      type: object
      description: >-
        Busta generica di risposta per un elenco paginato, specializzata
        per singola risorsa tramite `allOf` con l'array `results`
        tipizzato. Riporta `pagination` in modalità a offset, `nextCursor`
        in modalità a cursore (vedi parametri `page`/`cursor`): mai
        entrambi, e nessuno dei due se non esistono altri
        risultati/pagine.
      required:
        - results
      properties:
        results:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'
        nextCursor:
          type: string
          description: >-
            Cursore opaco da passare come parametro `cursor` per ottenere
            la pagina successiva, in modalità cursore. Assente se non
            esistono altri risultati.

    Limit:
      type: integer
      default: 25
      maximum: 200

    PatchOp:
      type: object
      description: >-
        Singola operazione JSON Patch (RFC 6902). Sottoinsieme supportato:
        add/remove/replace (non supportati move/copy/test).
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
          description: Operazione da eseguire.
          examples:
            - replace
        path:
          type: string
          description: JSON Pointer (RFC 6901) del campo su cui operare.
          examples:
            - "/stato"
        value:
          description: >-
            Nuovo valore. Obbligatorio per `add`/`replace`, assente per
            `remove`. Può essere di qualsiasi tipo JSON (stringa, numero,
            booleano, oggetto, array), non solo oggetto.
          examples:
            - "ANNULLATA"
    # ============================================================
    # ERRORI
    # ============================================================

    Problem:
      type: object
      description: >-
        Descrizione di un errore in formato "Problem Details for HTTP APIs"
        (RFC 7807), come previsto dalle Linee guida di interoperabilità
        AGID. Restituito con Content-Type `application/problem+json`.
      required:
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            URI che identifica il tipo di errore GovPay, puntando alla
            pagina del manuale che lo documenta: l'ultimo segmento del path
            è il codice errore, da cui è univocamente ricavabile anche la
            relativa categoria (consultando la stessa pagina). Se assente,
            equivale a "about:blank", cioè il problema non ha semantica
            oltre quella del codice di stato HTTP.
          examples:
            - 'https://govpay.readthedocs.io/it/latest/manuale/errori/PPT_CANALE_IRRAGGIUNGIBILE'
        title:
          type: string
          description: >-
            Riassunto sintetico e leggibile del tipo di problema, invariato
            tra le diverse occorrenze dello stesso `type`.
          examples:
            - Richiesta non valida
        status:
          type: integer
          description: Codice di stato HTTP di questa occorrenza del problema.
          examples:
            - 400
        detail:
          type: string
          description: >-
            Spiegazione specifica di questa occorrenza del problema, utile
            al debug (non è detto sia adatta a essere mostrata all'utente
            finale).
          examples:
            - "Il campo 'importo' non può essere negativo"
        instance:
          type: string
          format: uri
          description: Identificatore URI di questa specifica occorrenza del problema.


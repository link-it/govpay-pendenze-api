openapi: 3.1.0
info:
  version: "3.0.0"
  title: GovPay - API Pendenze
  description: >-
    API di integrazione GovPay per la gestione delle pendenze, destinate ai
    sistemi verticali dell'Ente Creditore e alle altre applicazioni
    preventivamente censite e autorizzate sull'istanza GovPay. Per il
    censimento delle applicazioni, le credenziali di accesso e ulteriori
    dettagli si rimanda alla documentazione ufficiale:
    https://govpay.readthedocs.io/it/latest/integrazione/api/index.html.

    Le versioni minor o di bugfix successive all'interno di questa major
    version (v3) possono introdurre nuovi campi nei payload di richiesta e
    di risposta, senza che ciò costituisca una modifica incompatibile.
    Perché le integrazioni realizzate su questa major version continuino a
    funzionare correttamente anche dopo tali evolutive, i client DEVONO
    tollerare e ignorare eventuali campi non riconosciuti, sia nelle
    risposte ricevute che, se già presenti in una richiesta per altri
    scopi, nei payload inviati. Coerentemente, gli schemi di questa
    specifica non vincolano l'insieme di proprietà accettate/restituite a
    quello esplicitamente documentato.
  contact:
    name: GitHub Project Page
    url: 'https://github.com/link-it/GovPay/'
  license:
    name: GPL
    url: 'https://github.com/link-it/GovPay/blob/master/LICENSE'
servers:
  - url: /govpay/backend/api/pendenze/rs/basic/v3/
tags:
  - name: PosizioniDebitorie
    description: Alimentazione e consultazione delle posizioni debitorie
  - name: Pendenze
    description: Consultazione e aggiornamento puntuale delle singole pendenze (rate)
  - name: Anagrafiche
    description: >-
      Consultazione delle anagrafiche di domini, unità operative, tipi
      pendenza, IBAN di accredito e tipi entrata. Sono visibili solo le
      entità per cui l'applicativo chiamante ha autorizzazione.
security:
  - basicAuth: []
paths:

  # ============================================================
  # POSIZIONI DEBITORIE
  # ============================================================

  '/posizioni-debitorie/{idA2A}':
    get:
      tags:
        - PosizioniDebitorie
      summary: Elenco delle posizioni debitorie
      operationId: findPosizioniDebitorie
      description: >-
        Fornisce la lista delle posizioni debitorie del gestionale che
        hanno tra i soggetti debitori quello indicato.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - $ref: '#/components/parameters/idDebitore'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/total'
      responses:
        '200':
          description: Elenco delle posizioni debitorie che rispettano i filtri di ricerca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosizioniDebitorie'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
    post:
      tags:
        - PosizioniDebitorie
      summary: Creazione di una posizione debitoria
      operationId: addPosizioneDebitoria
      description: >-
        Crea una nuova posizione debitoria, comprensiva dei soggetti
        debitori (anche in solido) e di una o più opzioni di pagamento
        alternative (es. unica soluzione, piano rateale), ciascuna con le
        proprie pendenze (rate).
        Un secondo tentativo di creazione con lo stesso idPosizioneDebitoria
        viene rifiutato (409): l'operazione crea la posizione debitoria
        esattamente una volta e non aggiorna una posizione esistente. Se
        `navNotifica` è indicato, deve corrispondere al `numeroAvviso` di
        una delle pendenze appena create: la richiesta è rifiutata con 400
        in caso contrario.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovaPosizioneDebitoria'
            examples:
              unicaSoluzione:
                summary: >-
                  Caso più semplice e più frequente: un'unica pendenza da
                  pagare in un'unica soluzione
                value:
                  idPosizioneDebitoria: CERT2026-000058
                  idDominio: '12345678901'
                  descrizione: 'Diritti di segreteria - certificato di residenza'
                  soggettiDebitori:
                    - tipo: F
                      identificativo: FRRPLA90C41H501Y
                      anagrafica: Paola Ferrari
                  opzioniPagamento:
                    - tipologia: SOLUZIONE_UNICA
                      pendenze:
                        - idPendenza: CERT2026-000058-UNICA
                          idTipoPendenza: DIRITTI_SEGRETERIA
                          importo: 16.00
                          voci:
                            - idVocePendenza: CERT2026-000058-UNICA_1
                              importo: 16.00
                              descrizione: 'Diritti di segreteria - certificato di residenza'
                              tipoRiferimento: RIFERIMENTO_ENTRATA
                              codEntrata: DIRITTI_SEGRETERIA
              unicaSoluzioneORateale:
                summary: >-
                  Debito pagabile in un'unica soluzione oppure, in
                  alternativa, in 3 rate
                value:
                  idPosizioneDebitoria: IMU2026-000017
                  idDominio: '12345678901'
                  descrizione: 'IMU 2026 - immobile in via Garibaldi 5'
                  soggettiDebitori:
                    - tipo: F
                      identificativo: VRDGNN80A01H501W
                      anagrafica: Giovanna Verdi
                  opzioniPagamento:
                    - tipologia: SOLUZIONE_UNICA
                      dataScadenza: '2026-06-16'
                      pendenze:
                        - idPendenza: IMU2026-000017-UNICA
                          idTipoPendenza: IMU
                          importo: 600.00
                          voci:
                            - idVocePendenza: IMU2026-000017-UNICA_1
                              importo: 600.00
                              descrizione: 'IMU 2026 - saldo unico'
                              tipoRiferimento: RIFERIMENTO_ENTRATA
                              codEntrata: IMU
                    - tipologia: PIANO_RATEALE
                      dataScadenza: '2026-12-16'
                      pendenze:
                        - idPendenza: IMU2026-000017-R1
                          idTipoPendenza: IMU
                          importo: 200.00
                          voci:
                            - idVocePendenza: IMU2026-000017-R1_1
                              importo: 200.00
                              descrizione: 'IMU 2026 - rata 1 di 3'
                              tipoRiferimento: RIFERIMENTO_ENTRATA
                              codEntrata: IMU
                        - idPendenza: IMU2026-000017-R2
                          idTipoPendenza: IMU
                          importo: 200.00
                          voci:
                            - idVocePendenza: IMU2026-000017-R2_1
                              importo: 200.00
                              descrizione: 'IMU 2026 - rata 2 di 3'
                              tipoRiferimento: RIFERIMENTO_ENTRATA
                              codEntrata: IMU
                        - idPendenza: IMU2026-000017-R3
                          idTipoPendenza: IMU
                          importo: 200.00
                          voci:
                            - idVocePendenza: IMU2026-000017-R3_1
                              importo: 200.00
                              descrizione: 'IMU 2026 - rata 3 di 3'
                              tipoRiferimento: RIFERIMENTO_ENTRATA
                              codEntrata: IMU
              multaConRiduzione:
                summary: >-
                  Sanzione con riduzione del 30% se pagata entro 5 giorni,
                  altrimenti a tariffa intera
                value:
                  idPosizioneDebitoria: VERBALE2026-000123
                  idDominio: '12345678901'
                  descrizione: 'Verbale n. 123/2026 - violazione art. 142 CdS'
                  soggettiDebitori:
                    - tipo: F
                      identificativo: BNCLRA75B02H501K
                      anagrafica: Laura Bianchi
                  opzioniPagamento:
                    - tipologia: SOLUZIONE_UNICA_ENTRO
                      giorni: 5
                      pendenze:
                        - idPendenza: VERBALE2026-000123-RIDOTTA
                          idTipoPendenza: SANZIONE_CDS
                          importo: 70.00
                          voci:
                            - idVocePendenza: VERBALE2026-000123-RIDOTTA_1
                              importo: 70.00
                              descrizione: >-
                                Sanzione in misura ridotta (-30%), pagamento
                                entro 5 giorni dalla notifica
                              tipoRiferimento: RIFERIMENTO_ENTRATA
                              codEntrata: SANZIONE_CDS
                    - tipologia: SOLUZIONE_UNICA_OLTRE
                      giorni: 5
                      pendenze:
                        - idPendenza: VERBALE2026-000123-INTERA
                          idTipoPendenza: SANZIONE_CDS
                          importo: 100.00
                          voci:
                            - idVocePendenza: VERBALE2026-000123-INTERA_1
                              importo: 100.00
                              descrizione: >-
                                Sanzione in misura intera, pagamento dopo il
                                5° giorno dalla notifica
                              tipoRiferimento: RIFERIMENTO_ENTRATA
                              codEntrata: SANZIONE_CDS
      responses:
        '201':
          description: >-
            Posizione debitoria creata. La risposta contiene lo stesso
            contenuto di una GET sulla risorsa appena creata (comprese le
            opzioni di pagamento e le pendenze generate).
          headers:
            Location:
              description: URL della posizione debitoria creata (`/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosizioneDebitoria'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Esiste già una posizione debitoria con questo idPosizioneDebitoria per questo idA2A
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  value:
                    status: 409
                    title: Esiste già una posizione debitoria con questo idPosizioneDebitoria per questo idA2A
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}':
    get:
      tags:
        - PosizioniDebitorie
      summary: Dettaglio di una posizione debitoria
      operationId: getPosizioneDebitoria
      description: >-
        Acquisisce il dettaglio della posizione debitoria, comprensivo di
        tutte le opzioni di pagamento e delle relative pendenze (rate).
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: Identificativo della posizione debitoria
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      responses:
        '200':
          description: Informazioni dettagliate della posizione debitoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosizioneDebitoria'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
    patch:
      tags:
        - PosizioniDebitorie
      summary: Aggiornamento di uno o più campi di una posizione debitoria
      operationId: updatePosizioneDebitoria
      description: >-
        Aggiorna i campi della posizione debitoria (es. `descrizione`,
        `soggettiDebitori`, `dataPubblicazione`, `notificaSend`,
        `navNotifica`). Se `navNotifica` è indicato, deve corrispondere al
        `numeroAvviso` di una delle pendenze della posizione: la richiesta
        è rifiutata con 400 in caso contrario. Le opzioni di pagamento
        non si aggiornano qui: per aggiungerne una si usa
        `POST .../opzioni-pagamento`, per cambiarne lo stato
        `PATCH .../opzioni-pagamento/{idOpzionePagamento}`.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: Identificativo della posizione debitoria
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOp'
              description: Lista di operazioni JSON Patch (RFC 6902) da applicare
      responses:
        '200':
          description: Posizione debitoria aggiornata con successo
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/opzioni-pagamento':
    post:
      tags:
        - PosizioniDebitorie
      summary: Aggiunta di un'opzione di pagamento a una posizione debitoria esistente
      operationId: addOpzionePagamento
      description: >-
        Aggiunge una nuova opzione di pagamento (con le sue pendenze) a una
        posizione debitoria già esistente.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: Identificativo della posizione debitoria
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuovaOpzionePagamento'
      responses:
        '201':
          description: Opzione di pagamento creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpzionePagamento'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            La posizione debitoria ha già un'opzione di pagamento ATTIVATA
            (pagamento già eseguito): non è più possibile aggiungere
            alternative. Oppure una pendenza della nuova opzione ha un
            idPendenza già usato da un'altra pendenza della stessa
            applicazione.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                giaAttivata:
                  summary: La posizione ha già un'opzione ATTIVATA
                  value:
                    status: 409
                    title: >-
                      La posizione debitoria ha già un'opzione di pagamento
                      ATTIVATA: non è più possibile aggiungere alternative
                idPendenzaDuplicato:
                  summary: idPendenza già usato da questa applicazione
                  value:
                    status: 409
                    title: >-
                      Una pendenza della nuova opzione ha un idPendenza già
                      usato da un'altra pendenza della stessa applicazione
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/opzioni-pagamento/{idOpzionePagamento}':
    patch:
      tags:
        - PosizioniDebitorie
      summary: Aggiornamento dello stato di un'opzione di pagamento
      operationId: updateOpzionePagamento
      description: >-
        Annulla un'opzione di pagamento esistente
        (`{"op": "replace", "path": "/stato", "value": "ANNULLATA"}`).
        Non è previsto un DELETE: un'opzione non si elimina, si annulla,
        preservandone la storia. L'operazione è consentita solo se l'opzione
        è attualmente DISPONIBILE: un'opzione già ATTIVATA da un pagamento
        non può essere annullata.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPosizioneDebitoria
          description: Identificativo della posizione debitoria
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idOpzionePagamento
          description: Identificativo dell'opzione di pagamento
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOp'
              description: Lista di operazioni JSON Patch (RFC 6902) da applicare
      responses:
        '200':
          description: Opzione di pagamento aggiornata con successo
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            L'opzione di pagamento è già ATTIVATA da un pagamento e non può
            essere annullata
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                default:
                  value:
                    status: 409
                    title: >-
                      L'opzione di pagamento è già ATTIVATA da un pagamento
                      e non può essere annullata
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  # ============================================================
  # PENDENZE (solo lettura/aggiornamento puntuale: niente PUT)
  # ============================================================

  '/pendenze/{idA2A}':
    get:
      tags:
        - Pendenze
      summary: Elenco delle pendenze
      operationId: findPendenze
      description: >-
        Fornisce la lista delle pendenze del gestionale corrispondenti a un
        avviso di pagamento.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - $ref: '#/components/parameters/numeroAvviso'
        - $ref: '#/components/parameters/idDominio'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/total'
      responses:
        '200':
          description: Elenco delle pendenze che rispettano i filtri di ricerca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pendenze'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/pendenze/{idA2A}/{idPendenza}':
    patch:
      description: aggiornamento puntuale di una pendenza
      tags:
        - Pendenze
      summary: Aggiornamento di uno o più campi di una pendenza
      operationId: updatePendenza
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPendenza
          description: Identificativo della pendenza
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOp'
              description: Lista di operazioni JSON Patch (RFC 6902) da applicare
      responses:
        '200':
          description: Pendenza aggiornata con successo
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'
    get:
      tags:
        - Pendenze
      summary: Dettaglio di una pendenza per identificativo
      operationId: getPendenza
      description: >-
        Acquisisce il dettaglio di una pendenza, comprensivo dei dati di
        pagamento, dell'opzione di pagamento e della posizione debitoria a
        cui appartiene.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPendenza
          description: Identificativo della pendenza
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
      responses:
        '200':
          description: Informazioni dettagliate della pendenza
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pendenza'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'

  '/pendenze/{idA2A}/{idPendenza}/stampa':
    get:
      tags:
        - Pendenze
      summary: Stampa dell'avviso di una pendenza
      operationId: getStampaPendenza
      description: >-
        Fornisce la stampa dell'avviso di pagamento della pendenza,
        identificata tramite gli identificativi del gestionale (idA2A e
        idPendenza) invece che tramite numeroAvviso. Le opzioni di
        personalizzazione testuale/traduzione dell'avviso (lingua
        secondaria, testi tradotti) si specificano nei parametri di questa
        chiamata.
      parameters:
        - in: path
          name: idA2A
          description: Identificativo del gestionale
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - in: path
          name: idPendenza
          description: Identificativo della pendenza
          required: true
          schema:
            type: string
            pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        - $ref: '#/components/parameters/linguaSecondaria'
        - $ref: '#/components/parameters/causaleTradotta'
        - $ref: '#/components/parameters/informativaImporto'
        - $ref: '#/components/parameters/informativaImportoTradotta'
      responses:
        '200':
          description: Avviso di pagamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avviso'
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403NotAuthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServiceUnavailable'


components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    idDominio:
      name: idDominio
      in: query
      description: >-
        Identificativo del dominio dell'ente. Filtro aggiuntivo opzionale,
        utilizzabile solo insieme a `numeroAvviso`: non è consentita una
        ricerca per solo idDominio.
      required: false
      schema:
        type: string
    numeroAvviso:
      name: numeroAvviso
      in: query
      description: >-
        Identificativo dell'avviso di pagamento pagoPA. Unico criterio di
        ricerca delle pendenze, da solo o abbinato a `idDominio`.
      required: true
      schema:
        type: string
        pattern: '(^[0-9]{18}$)'
      example: '123456789012345678'
    idDebitore:
      name: idDebitore
      in: query
      description: >-
        Identificativo (codice fiscale o partita IVA) di un soggetto
        debitore. In presenza di più debitori in solido, la ricerca trova
        la posizione debitoria se il valore corrisponde a QUALSIASI dei
        soggetti in soggettiDebitori. Unico criterio di ricerca delle
        posizioni debitorie.
      required: true
      schema:
        type: string
      example: 'RSSMRA30A01H501I'
    fields:
      name: fields
      in: query
      description: >-
        Elenco separato da virgole dei campi da restituire per ciascun
        risultato, per limitare la dimensione della risposta.
      required: false
      schema:
        type: string
    page:
      name: page
      in: query
      description: >-
        Numero di pagina (1-based), in modalità di paginazione a offset.
        Alternativo a `cursor`: non è consentito specificare entrambi
        nella stessa richiesta. Se nessuno dei due è specificato, si
        applica la modalità a offset con `page=1`.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    cursor:
      name: cursor
      in: query
      description: >-
        Cursore opaco (il valore `nextCursor` della risposta precedente)
        da cui continuare l'elenco, in modalità di paginazione a cursore.
        Alternativo a `page`: non è consentito specificare entrambi
        nella stessa richiesta. In questa modalità l'ordinamento dei
        risultati è quello fisso previsto per la risorsa, e non è
        influenzato da `sort`.
      required: false
      schema:
        type: string
    total:
      name: total
      in: query
      description: >-
        Se `true`, calcola e restituisce in `pagination.totalResults` e
        `pagination.totalPages` il conteggio complessivo dei risultati
        che rispettano i filtri di ricerca (richiede una query aggiuntiva
        di conteggio). Ignorato in modalità cursore.
      required: false
      schema:
        type: boolean
        default: false
      example: false
    limit:
      name: limit
      in: query
      description: Numero massimo di risultati per pagina (max 200).
      required: false
      schema:
        $ref: '#/components/schemas/Limit'
    sort:
      name: sort
      in: query
      description: >-
        Criterio di ordinamento dei risultati: uno o più campi nella
        forma `campo:asc` o `campo:desc`, separati da virgola (priorità
        nell'ordine specificato). Ignorato in modalità cursore, dove
        l'ordinamento è quello fisso previsto per la risorsa. Se assente
        (in modalità a offset), si applica l'ordinamento predefinito
        della risorsa.
      required: false
      schema:
        type: string
      example: 'dataCreazione:desc'
    linguaSecondaria:
      name: linguaSecondaria
      in: query
      description: >-
        Indica se creare l'avviso in modalita' multilingua e quale seconda
        lingua affiancare all'italiano all'interno dell'avviso.
      required: false
      schema:
        $ref: '#/components/schemas/LinguaSecondaria'
    causaleTradotta:
      name: causaleTradotta
      in: query
      description: >-
        Causale della pendenza tradotta nella lingua secondaria, da inserire
        nell'avviso.
      required: false
      schema:
        type: string
    informativaImporto:
      name: informativaImporto
      in: query
      description: >-
        Se valorizzato, sostituisce il testo standard della nota informativa
        sull'importo. Se valorizzato con stringa vuota, l'informativa viene
        omessa.
      required: false
      schema:
        type: string
        maxLength: 255
    informativaImportoTradotta:
      name: informativaImportoTradotta
      in: query
      description: Versione tradotta di `informativaImporto`, nella lingua secondaria.
      required: false
      schema:
        type: string
        maxLength: 255

  responses:
    400BadRequest:
      description: Richiesta non valida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 400
                title: Richiesta non valida
                detail: "Il campo 'importo' non può essere negativo"
    401NotAuthenticated:
      description: Utenza non autenticata
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 401
                title: Utenza non autenticata
    403NotAuthorized:
      description: Utenza non autorizzata a eseguire l'operazione richiesta
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 403
                title: Utenza non autorizzata a eseguire l'operazione richiesta
    404NotFound:
      description: Risorsa non trovata
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 404
                title: Risorsa non trovata
    500ServiceUnavailable:
      description: Errore interno del servizio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                status: 500
                title: Errore interno del servizio
                type: 'https://govpay.readthedocs.io/it/latest/manuale/errori/INTERNO'

  schemas:

    # ============================================================
    # POSIZIONE DEBITORIA - SCRITTURA
    # ============================================================

    NuovaPosizioneDebitoria:
      type: object
      required:
        - idPosizioneDebitoria
        - idDominio
        - descrizione
        - soggettiDebitori
        - opzioniPagamento
      properties:
        idPosizioneDebitoria:
          type: string
          description: >-
            Identificativo della posizione debitoria nel gestionale
            proprietario. Deve essere univoco per idA2A: la richiesta viene
            rifiutata con 409 se esiste già una posizione con questo
            identificativo per lo stesso idA2A.
          examples:
            - abcdef12345
          pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        idDominio:
          type: string
          description: Identificativo del dominio creditore
          examples:
            - '1234567890'
          minLength: 1
          maxLength: 35
          pattern: '(^([0-9]){11}$)'
        idUnitaOperativa:
          type: string
          description: Identificativo dell'unita' operativa
          examples:
            - UO33132
          minLength: 1
          maxLength: 35
          pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        descrizione:
          type: string
          description: Descrizione generale della posizione debitoria
          examples:
            - 'Sanzione CdS n. abc00000'
          maxLength: 140
        soggettiDebitori:
          type: array
          description: >-
            Elenco dei soggetti obbligati al pagamento della posizione
            debitoria. In presenza di più soggetti (debitori in solido),
            ciascuno di essi può autenticarsi e gestire/pagare per intero
            qualsiasi pendenza della posizione. Il primo elemento
            dell'elenco è quello utilizzato come "soggetto pagatore"
            nell'RPT verso il Nodo dei Pagamenti e nelle comunicazioni che
            richiedono un unico destinatario, essendo il Nodo dei Pagamenti
            vincolato a un solo soggetto pagatore per avviso.
          minItems: 1
          items:
            $ref: '#/components/schemas/Soggetto'
        dataPubblicazione:
          type: string
          format: date
          description: >-
            Data a partire dalla quale la posizione debitoria (e tutte le
            sue pendenze) diventa visibile e pagabile. Fino a tale data si
            comporta come se non esistesse per qualsiasi ricerca/pagamento
            esterno (Nodo dei Pagamenti, ricerca per avviso); resta invece
            sempre visibile e gestibile per l'applicazione che l'ha creata.
            Al momento della pubblicazione viene, tra le altre cose, inviata
            la notifica ai debitori (email/AppIO/altro canale configurato).
            Se non specificata, la posizione debitoria è pubblicata
            immediatamente.
          examples:
            - '2026-01-15'
        notificaSend:
          type: boolean
          description: >-
            Indica se la posizione debitoria è notificata (o va notificata)
            tramite SEND. Se attivo, GovPay maggiora l'importo pagato in
            sede di pagamento con le spese di notifica SEND. Non va
            attivato se le pendenze della posizione includono già tali
            spese nel proprio importo (voce con dettaglioContabile di tipo
            SPESE_NOTIFICA). Se assente, equivale a `false`.
        navNotifica:
          type: string
          description: >-
            NAV (numero avviso) con cui la posizione debitoria è notificata
            tramite SEND. Deve corrispondere al `numeroAvviso` di una delle
            pendenze della posizione: GovPay lo verifica e rifiuta la
            richiesta se non corrisponde a nessuna. Se non indicato mentre
            `notificaSend` è attivo, GovPay lo assegna automaticamente
            (tipicamente la pendenza dell'opzione SOLUZIONE_UNICA se
            presente, altrimenti la rata 1 dell'unico PIANO_RATEALE).
          pattern: '(^[0-9]{18}$)'
        opzioniPagamento:
          type: array
          description: >-
            Modalità alternative con cui può essere estinta la posizione
            debitoria (es. pagamento in un'unica soluzione oppure piano
            rateale). Ricalca il modello "Opzioni di pagamento" di pagoPA
            (https://developer.pagopa.it/pago-pa/guides/sanp/ente-creditore/opzioni-di-pagamento).
          minItems: 1
          items:
            $ref: '#/components/schemas/NuovaOpzionePagamento'

    TipologiaOpzionePagamento:
      type: string
      description: >-
        Modalità con cui può essere estinta la posizione debitoria.
      enum:
        - PIANO_RATEALE
        - SOLUZIONE_UNICA
        - SOLUZIONE_UNICA_ENTRO
        - SOLUZIONE_UNICA_OLTRE
      examples:
        - SOLUZIONE_UNICA

    NuovaOpzionePagamento:
      type: object
      description: >-
        Modalità con cui può essere estinta la posizione debitoria (es.
        pagamento in un'unica soluzione oppure piano rateale). Ogni
        tipologia impone un proprio vincolo sulla cardinalità di `pendenze`
        e sui campi obbligatori.
      required: [tipologia]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
      oneOf:
        - $ref: '#/components/schemas/NuovaOpzionePagamentoPianoRateale'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnica'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaEntro'
        - $ref: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaOltre'
      discriminator:
        propertyName: tipologia
        mapping:
          PIANO_RATEALE: '#/components/schemas/NuovaOpzionePagamentoPianoRateale'
          SOLUZIONE_UNICA: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnica'
          SOLUZIONE_UNICA_ENTRO: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaEntro'
          SOLUZIONE_UNICA_OLTRE: '#/components/schemas/NuovaOpzionePagamentoSoluzioneUnicaOltre'

    NuovaOpzionePagamentoPianoRateale:
      type: object
      required: [tipologia, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: >-
            Le rate del piano, nell'ordine in cui vanno pagate: GovPay
            assegna `numeroRata` in base alla posizione di ciascuna
            pendenza in questo array. Servono almeno due rate: con una
            sola si usa SOLUZIONE_UNICA.
          minItems: 2
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnica:
      type: object
      required: [tipologia, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: >-
            Una o più pendenze pagabili in un'unica soluzione: più di una
            solo quando il dovuto supera le 5 voci ammesse per un singolo
            avviso di pagamento, e va quindi ripartito su più avvisi. La
            logica è la stessa del piano rateale (la posizione è pagata
            quando tutte le sue pendenze sono pagate): cambia solo il
            layout di stampa degli avvisi.
          minItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnicaEntro:
      type: object
      required: [tipologia, giorni, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          allOf:
            - $ref: '#/components/schemas/giornoOpzionePagamento'
          description: >-
            Numero di giorni entro cui va eseguito il pagamento. Il
            conteggio non decorre necessariamente dalla creazione della
            posizione debitoria: può ad esempio partire dal momento in cui
            il debitore seleziona questa opzione tra quelle disponibili.
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: Esattamente una pendenza per l'intero importo.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    NuovaOpzionePagamentoSoluzioneUnicaOltre:
      type: object
      required: [tipologia, giorni, pendenze]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          allOf:
            - $ref: '#/components/schemas/giornoOpzionePagamento'
          description: >-
            Numero di giorni decorsi i quali il pagamento diventa possibile
            (non prima). Il conteggio non decorre necessariamente dalla
            creazione della posizione debitoria: può ad esempio partire dal
            momento in cui il debitore seleziona questa opzione tra quelle
            disponibili.
        dataInizioValidita:
          $ref: '#/components/schemas/dataInizioValiditaOpzionePagamento'
        dataScadenza:
          $ref: '#/components/schemas/dataScadenzaOpzionePagamento'
        pendenze:
          type: array
          description: Esattamente una pendenza per l'intero importo.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/NuovaPendenza'

    dataInizioValiditaOpzionePagamento:
      type: string
      format: date
      description: >-
        Data a partire dalla quale questa opzione di pagamento (e tutte le
        pendenze/rate che la compongono) diventa pagabile. Se assente, è
        pagabile da subito.
      examples:
        - '2026-01-15'
    dataScadenzaOpzionePagamento:
      type: string
      format: date
      description: >-
        Data fino alla quale questa opzione di pagamento (e tutte le
        pendenze/rate che la compongono) resta pagabile. Governa un piano
        rateale nel suo complesso: superata questa data nessuna rata resta
        pagabile, indipendentemente dalle rate già scadute individualmente,
        così che un piano avviato non decada rata per rata. Se assente,
        l'opzione non ha una scadenza di pagamento.
      examples:
        - '2026-06-30'

    giornoOpzionePagamento:
      type: integer
      minimum: 1
      maximum: 3650
      description: >-
        Numero di giorni (intero, non frazionario) entro/decorsi i quali va
        eseguito il pagamento di SOLUZIONE_UNICA_ENTRO/OLTRE. Limite massimo
        di 3650 (10 anni), ampiamente sufficiente per qualsiasi caso reale.
      examples:
        - 5
    NuovaPendenza:
      type: object
      required:
        - idPendenza
        - idTipoPendenza
        - importo
        - voci
      properties:
        idPendenza:
          type: string
          description: Identificativo della pendenza (rata) nel gestionale proprietario.
          examples:
            - abcdef12345
          pattern: '(^[a-zA-Z0-9\-_]{1,35}$)'
        idTipoPendenza:
          type: string
          description: Identificativo della tipologia pendenza
          examples:
            - IMU
          pattern: '(^[a-zA-Z0-9\-_\.]{1,35}$)'
        importo:
          type: number
          description: Importo della pendenza. Deve corrispondere alla somma delle singole voci.
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        numeroAvviso:
          type: string
          description: >-
            Identificativo univoco versamento. Opzionale: se non fornito,
            viene generato automaticamente da GovPay.
          examples:
            - '123456789012345678'
          pattern: '(^[0-9]{18}$)'
        dataValidita:
          type: string
          format: date
          description: >-
            Data fino alla quale i dati della pendenza sono da considerarsi
            validi e non necessitano di essere attualizzati. Se assente, i
            dati vengono attualizzati a ogni richiesta.
          examples:
            - '2019-12-31'
        dataScadenzaAvviso:
          type: string
          format: date
          description: >-
            Data di scadenza da stampare sull'avviso di pagamento mostrato
            al debitore. Se assente, si usa la data di scadenza dell'opzione
            di pagamento a cui la pendenza appartiene; se anche questa è
            assente, sull'avviso non viene stampata alcuna scadenza.
          examples:
            - '2020-12-15'
        voci:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/NuovaVocePendenza'

    TipoRiferimentoVocePendenza:
      type: string
      description: >-
        Tipo di riferimento di incasso di una voce di pendenza: discrimina
        quale delle 3 forme (RiferimentoEntrata/Entrata/Bollo) si sta
        fornendo o leggendo.
      enum:
        - RIFERIMENTO_ENTRATA
        - ENTRATA
        - BOLLO
      examples:
        - RIFERIMENTO_ENTRATA

    NuovaVocePendenza:
      type: object
      description: >-
        Voce di pendenza. La forma varia in base al tipo di riferimento di
        incasso: `dettaglioContabile` è disponibile solo per
        NuovaVocePendenzaRiferimentoEntrata e NuovaVocePendenzaEntrata; per
        una marca da bollo (NuovaVocePendenzaBollo) la classificazione
        contabile avviene solo tramite `tassonomia`.
      required: [tipoRiferimento]
      properties:
        tipoRiferimento:
          $ref: '#/components/schemas/TipoRiferimentoVocePendenza'
      oneOf:
        - $ref: '#/components/schemas/NuovaVocePendenzaRiferimentoEntrata'
        - $ref: '#/components/schemas/NuovaVocePendenzaEntrata'
        - $ref: '#/components/schemas/NuovaVocePendenzaBollo'
      discriminator:
        propertyName: tipoRiferimento
        mapping:
          RIFERIMENTO_ENTRATA: '#/components/schemas/NuovaVocePendenzaRiferimentoEntrata'
          ENTRATA: '#/components/schemas/NuovaVocePendenzaEntrata'
          BOLLO: '#/components/schemas/NuovaVocePendenzaBollo'

    DatiComuniVocePendenza:
      type: object
      required:
        - idVocePendenza
        - importo
        - descrizione
      properties:
        idVocePendenza:
          type: string
          description: Identificativo della voce di pedenza nel gestionale proprietario
          examples:
            - abcdef12345_1
          minLength: 1
          maxLength: 35
        importo:
          type: number
          description: Importo della voce
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        descrizione:
          type: string
          description: descrizione della voce di pagamento
          examples:
            - 'Sanzione CdS n. abc00000'
          minLength: 1
          maxLength: 140
        idDominio:
          type: string
          description: Identificativo del dominio creditore
          examples:
            - '1234567890'
          minLength: 1
          maxLength: 35
          pattern: '(^([0-9]){11}$)'

    NuovaVocePendenzaRiferimentoEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/RiferimentoEntrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenza'
        - type: object
          required: [tipoRiferimento]
          properties:
            tipoRiferimento:
              $ref: '#/components/schemas/TipoRiferimentoVocePendenza'
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile per il transfer
                generato da questa voce, secondo il Dizionario dei metadata
                pagoPA (sezione "Riconciliazione contabile"). Solo le
                tipologie catalogate sono accettate in scrittura.
              items:
                $ref: '#/components/schemas/dettaglio'

    NuovaVocePendenzaEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/Entrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenza'
        - type: object
          required: [tipoRiferimento]
          properties:
            tipoRiferimento:
              $ref: '#/components/schemas/TipoRiferimentoVocePendenza'
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile per il transfer
                generato da questa voce, secondo il Dizionario dei metadata
                pagoPA (sezione "Riconciliazione contabile"). Solo le
                tipologie catalogate sono accettate in scrittura.
              items:
                $ref: '#/components/schemas/dettaglio'

    NuovaVocePendenzaBollo:
      type: object
      description: >-
        Nessuna proprietà `dettaglioContabile`: per il bollo la
        classificazione avviene solo tramite `tassonomia` (vedi schema Bollo).
      allOf:
        - $ref: '#/components/schemas/Bollo'
        - $ref: '#/components/schemas/DatiComuniVocePendenza'
        - type: object
          required: [tipoRiferimento]
          properties:
            tipoRiferimento:
              $ref: '#/components/schemas/TipoRiferimentoVocePendenza'

    # ============================================================
    # POSIZIONE DEBITORIA - LETTURA
    # ============================================================

    PosizioneDebitoriaIndex:
      type: object
      required:
        - idA2A
        - idPosizioneDebitoria
        - idDominio
        - descrizione
        - soggettiDebitori
      properties:
        idA2A:
          type: string
          description: Identificativo del gestionale responsabile della posizione debitoria
          examples:
            - A2A-12345
        idPosizioneDebitoria:
          type: string
          description: Identificativo della posizione debitoria nel gestionale responsabile
          examples:
            - abcdef12345
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore. Anagrafica consultabile su
            `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
        idUnitaOperativa:
          type: string
          description: >-
            Identificativo dell'unità operativa, se presente. Anagrafica
            consultabile su `GET /domini/{idDominio}/unita-operative/{idUnitaOperativa}`.
          examples:
            - UO33132
        descrizione:
          type: string
          examples:
            - 'Sanzione CdS n. abc00000'
        soggettiDebitori:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Soggetto'
        dataPubblicazione:
          type: string
          format: date
        notificaSend:
          type: boolean
        navNotifica:
          type: string

    PosizioneDebitoria:
      description: >-
        Dettaglio completo di una posizione debitoria, comprensivo di tutte
        le sue opzioni di pagamento e delle pendenze che le compongono.
      type: object
      required:
        - idA2A
        - idPosizioneDebitoria
        - idDominio
        - descrizione
        - soggettiDebitori
        - opzioniPagamento
      properties:
        idA2A:
          type: string
          description: Identificativo del gestionale responsabile della posizione debitoria
          examples:
            - A2A-12345
        idPosizioneDebitoria:
          type: string
          description: Identificativo della posizione debitoria nel gestionale responsabile
          examples:
            - abcdef12345
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore. Anagrafica consultabile su
            `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
        idUnitaOperativa:
          type: string
          description: >-
            Identificativo dell'unità operativa, se presente. Anagrafica
            consultabile su `GET /domini/{idDominio}/unita-operative/{idUnitaOperativa}`.
          examples:
            - UO33132
        descrizione:
          type: string
          examples:
            - 'Sanzione CdS n. abc00000'
        soggettiDebitori:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Soggetto'
        dataPubblicazione:
          type: string
          format: date
        notificaSend:
          type: boolean
        navNotifica:
          type: string
        opzioniPagamento:
          type: array
          items:
            $ref: '#/components/schemas/OpzionePagamento'

    OpzionePagamentoIndex:
      type: object
      description: >-
        Riferimento all'opzione di pagamento a cui appartiene una pendenza,
        senza l'elenco delle pendenze che la compongono.
      required: [tipologia]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
      oneOf:
        - $ref: '#/components/schemas/OpzionePagamentoIndexPianoRateale'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnica'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaEntro'
        - $ref: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaOltre'
      discriminator:
        propertyName: tipologia
        mapping:
          PIANO_RATEALE: '#/components/schemas/OpzionePagamentoIndexPianoRateale'
          SOLUZIONE_UNICA: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnica'
          SOLUZIONE_UNICA_ENTRO: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaEntro'
          SOLUZIONE_UNICA_OLTRE: '#/components/schemas/OpzionePagamentoIndexSoluzioneUnicaOltre'

    StatoOpzionePagamento:
      type: string
      description: >-
        Stato dell'opzione di pagamento. Un'opzione nasce DISPONIBILE, cioè
        ancora selezionabile dal debitore. Quando arriva un pagamento su una
        delle sue pendenze, l'opzione passa automaticamente ad ATTIVATA: è
        quella con cui il debitore ha effettivamente pagato. Nello stesso
        momento tutte le altre opzioni della stessa posizione debitoria,
        se ancora DISPONIBILI, passano automaticamente ad ANNULLATA, essendo
        alternative non più applicabili. Un'opzione DISPONIBILE può anche
        essere annullata manualmente tramite PATCH su
        `/posizioni-debitorie/{idA2A}/{idPosizioneDebitoria}/opzioni-pagamento/{idOpzionePagamento}`
        (`{"op": "replace", "path": "/stato", "value": "ANNULLATA"}`); un'opzione
        già ATTIVATA non può invece essere annullata, perché corrisponde a un
        pagamento già eseguito. ANNULLATA è uno stato definitivo.
      enum:
        - DISPONIBILE
        - ATTIVATA
        - ANNULLATA
      examples:
        - DISPONIBILE
    OpzionePagamentoIndexPianoRateale:
      type: object
      required: [idOpzionePagamento, tipologia, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          description: >-
            Identificativo dell'opzione di pagamento, generato da GovPay
            alla creazione. Usato nel path di
            `PATCH .../opzioni-pagamento/{idOpzionePagamento}`. Stabile per
            tutta la vita della posizione debitoria, indipendentemente da
            eventuali altre opzioni aggiunte in seguito.
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnica:
      type: object
      required: [idOpzionePagamento, tipologia, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnicaEntro:
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamentoIndexSoluzioneUnicaOltre:
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date

    OpzionePagamento:
      type: object
      description: >-
        Vista completa di un'opzione di pagamento, comprensiva delle
        pendenze che la compongono.
      required: [tipologia]
      properties:
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
      oneOf:
        - $ref: '#/components/schemas/OpzionePagamentoPianoRateale'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnica'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnicaEntro'
        - $ref: '#/components/schemas/OpzionePagamentoSoluzioneUnicaOltre'
      discriminator:
        propertyName: tipologia
        mapping:
          PIANO_RATEALE: '#/components/schemas/OpzionePagamentoPianoRateale'
          SOLUZIONE_UNICA: '#/components/schemas/OpzionePagamentoSoluzioneUnica'
          SOLUZIONE_UNICA_ENTRO: '#/components/schemas/OpzionePagamentoSoluzioneUnicaEntro'
          SOLUZIONE_UNICA_OLTRE: '#/components/schemas/OpzionePagamentoSoluzioneUnicaOltre'

    OpzionePagamentoPianoRateale:
      description: >-
        Opzione di pagamento a piano rateale, comprensiva delle rate
        (pendenze) che la compongono.
      type: object
      required: [idOpzionePagamento, tipologia, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          description: >-
            Identificativo dell'opzione di pagamento, generato da GovPay
            alla creazione.
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnica:
      description: >-
        Opzione di pagamento in unica soluzione, comprensiva della/e
        pendenza/e che la compongono (più di una solo quando il dovuto
        supera le 5 voci ammesse per un singolo avviso di pagamento).
      type: object
      required: [idOpzionePagamento, tipologia, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnicaEntro:
      description: >-
        Opzione di pagamento in unica soluzione con termine di pagamento
        espresso in giorni, comprensiva della pendenza che la compone.
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    OpzionePagamentoSoluzioneUnicaOltre:
      description: >-
        Opzione di pagamento in unica soluzione disponibile solo decorso un
        termine espresso in giorni, comprensiva della pendenza che la compone.
      type: object
      required: [idOpzionePagamento, tipologia, giorni, stato, pendenze]
      properties:
        idOpzionePagamento:
          type: string
          format: uuid
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipologia:
          $ref: '#/components/schemas/TipologiaOpzionePagamento'
        giorni:
          $ref: '#/components/schemas/giornoOpzionePagamento'
        stato:
          $ref: '#/components/schemas/StatoOpzionePagamento'
        dataInizioValidita:
          type: string
          format: date
        dataScadenza:
          type: string
          format: date
        pendenze:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PendenzaOpzionePagamento'

    # ============================================================
    # PENDENZA - LETTURA
    # ============================================================

    PendenzaBase:
      type: object
      required:
        - idA2A
        - idPendenza
        - idDominio
        - stato
        - opzionePagamento
        - numeroRata
        - importo
        - iuv
        - numeroAvviso
        - dataCaricamento
      properties:
        idA2A:
          type: string
          description: Identificativo del gestionale responsabile della pendenza
          examples:
            - A2A-12345
        idPendenza:
          type: string
          description: Identificativo della pendenza nel gestionale responsabile
          examples:
            - abcdef12345
        idTipoPendenza:
          type: string
          description: Identificativo della tipologia pendenza
          examples:
            - IMU
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore. Anagrafica consultabile su
            `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
        stato:
          $ref: '#/components/schemas/StatoPendenza'
        iuv:
          type: string
          description: Identificativo Univoco di Versamento assegnato alla pendenza.
          examples:
            - '000000000012345'
        dataPagamento:
          type: string
          format: date
          description: Data di pagamento della pendenza
          examples:
            - '2018-12-31'
        opzionePagamento:
          $ref: '#/components/schemas/OpzionePagamentoIndex'
        numeroRata:
          type: integer
          minimum: 1
          description: >-
            Numero di rata della pendenza all'interno della sua opzione di
            pagamento: corrisponde alla posizione (1-based) della pendenza
            nell'array `pendenze` dell'opzione. Per le opzioni SOLUZIONE_UNICA,
            SOLUZIONE_UNICA_ENTRO e SOLUZIONE_UNICA_OLTRE, che hanno
            un'unica pendenza, vale sempre 1. Non richiesto in scrittura: è
            GovPay ad assegnarlo in base all'ordine delle pendenze
            nell'array della relativa opzione di pagamento.
          examples:
            - 1
        importo:
          type: number
          description: Importo della pendenza. Deve corrispondere alla somma delle singole voci.
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        numeroAvviso:
          type: string
          description: Identificativo dell'avviso di pagamento pagoPA associato alla pendenza.
          examples:
            - '123456789012345678'
          pattern: '(^[0-9]{18}$)'
        dataCaricamento:
          type: string
          format: date
          description: Data di emissione della pendenza
          examples:
            - '2010-12-31'
        dataValidita:
          type: string
          format: date
          description: >-
            Data fino alla quale i dati della pendenza sono da considerarsi
            validi e non necessitano di essere attualizzati. Se assente, i
            dati vengono attualizzati a ogni richiesta.
          examples:
            - '2019-12-31'
        dataScadenzaAvviso:
          type: string
          format: date
          description: >-
            Data di scadenza da stampare sull'avviso di pagamento mostrato
            al debitore. Se assente, si usa la data di scadenza dell'opzione
            di pagamento a cui la pendenza appartiene; se anche questa è
            assente, sull'avviso non viene stampata alcuna scadenza.
          examples:
            - '2020-12-15'

    Pendenza:
      type: object
      allOf:
        - $ref: '#/components/schemas/PendenzaBase'
        - type: object
          required:
            - voci
            - posizioneDebitoria
          properties:
            voci:
              type: array
              minItems: 1
              maxItems: 5
              items:
                $ref: '#/components/schemas/VocePendenza'
            posizioneDebitoria:
              $ref: '#/components/schemas/PosizioneDebitoriaIndex'

    PendenzaIndex:
      type: object
      allOf:
        - $ref: '#/components/schemas/PendenzaBase'
        - type: object
          required:
            - posizioneDebitoria
          properties:
            posizioneDebitoria:
              $ref: '#/components/schemas/PosizioneDebitoriaIndex'

    PendenzaOpzionePagamento:
      type: object
      description: >-
        Pendenza (rata) vista dall'interno della sua opzione di pagamento:
        a differenza di `PendenzaIndex`, non riporta `posizioneDebitoria`,
        già noto da chi la contiene (la posizione debitoria stessa).
      allOf:
        - $ref: '#/components/schemas/PendenzaBase'

    Pendenze:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/PendenzaIndex'

    PosizioniDebitorie:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/PosizioneDebitoriaIndex'

    VocePendenza:
      type: object
      description: >-
        Voce di pendenza in lettura. La forma varia in base al tipo di
        riferimento di incasso: `dettaglioContabile` è disponibile solo per
        VocePendenzaRiferimentoEntrata e VocePendenzaEntrata; per una marca
        da bollo (VocePendenzaBollo) la classificazione contabile risulta
        solo tramite `tassonomia`.
      oneOf:
        - $ref: '#/components/schemas/VocePendenzaRiferimentoEntrata'
        - $ref: '#/components/schemas/VocePendenzaEntrata'
        - $ref: '#/components/schemas/VocePendenzaBollo'

    DatiComuniVocePendenzaLettura:
      type: object
      required:
        - idVocePendenza
        - importo
        - descrizione
        - indice
        - stato
      properties:
        idVocePendenza:
          type: string
          description: Identificativo della voce di pedenza nel gestionale proprietario
          examples:
            - abcdef12345_1
          minLength: 1
          maxLength: 35
        importo:
          type: number
          description: Importo della voce
          examples:
            - 10.01
          minimum: 0.00
          maximum: 10000000000000000.00
        descrizione:
          type: string
          description: descrizione della voce di pagamento
          examples:
            - 'Sanzione CdS n. abc00000'
          minLength: 1
          maxLength: 140
        indice:
          type: number
          description: indice di voce all'interno della pendenza
          examples:
            - 1
          minimum: 1
          maximum: 5
        stato:
          $ref: '#/components/schemas/StatoVocePendenza'
        idDominio:
          type: string
          description: >-
            Identificativo del dominio creditore di questa voce (se
            diverso da quello della pendenza, caso multi-beneficiario).
            Anagrafica consultabile su `GET /domini/{idDominio}`.
          examples:
            - '01234567890'
    VocePendenzaRiferimentoEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/RiferimentoEntrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenzaLettura'
        - type: object
          properties:
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile letto dai metadata
                della RT/RPT, secondo il Dizionario dei metadata pagoPA.
              items:
                $ref: '#/components/schemas/dettaglioLetto'

    VocePendenzaEntrata:
      type: object
      allOf:
        - $ref: '#/components/schemas/Entrata'
        - $ref: '#/components/schemas/DatiComuniVocePendenzaLettura'
        - type: object
          properties:
            dettaglioContabile:
              type: array
              description: >-
                Dettaglio di riconciliazione contabile letto dai metadata
                della RT/RPT, secondo il Dizionario dei metadata pagoPA.
              items:
                $ref: '#/components/schemas/dettaglioLetto'

    VocePendenzaBollo:
      type: object
      description: >-
        Nessuna proprietà `dettaglioContabile`: per il bollo la
        classificazione avviene solo tramite `tassonomia` (vedi schema Bollo).
      allOf:
        - $ref: '#/components/schemas/Bollo'
        - $ref: '#/components/schemas/DatiComuniVocePendenzaLettura'

    # ============================================================
    # SOGGETTO
    # ============================================================

    Soggetto:
      description: dati anagrafici di un versante o pagatore.
      type: object
      required:
        - tipo
        - identificativo
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSoggetto'
        identificativo:
          description: codice fiscale o partita iva del soggetto
          type: string
          examples:
            - RSSMRA30A01H501I
          minLength: 2
          maxLength: 16
        anagrafica:
          description: nome e cognome o altra ragione sociale del soggetto
          type: string
          examples:
            - Mario Rossi
          minLength: 1
          maxLength: 70
        indirizzo:
          type: string
          examples:
            - Piazza della Vittoria
          minLength: 1
          maxLength: 70
        civico:
          type: string
          examples:
            - 10/A
          minLength: 1
          maxLength: 16
        cap:
          type: string
          examples:
            - '00000'
          minLength: 1
          maxLength: 16
        localita:
          type: string
          examples:
            - Roma
          minLength: 1
          maxLength: 35
        provincia:
          type: string
          examples:
            - RM
        nazione:
          type: string
          examples:
            - IT
        email:
          type: string
          examples:
            - mario.rossi@email.it
    TipoSoggetto:
      description: >-
        tipologia di soggetto, se persona fisica (F) o giuridica (G)
      type: string
      enum:
        - G
        - F
      examples:
        - F
    RiferimentoEntrata:
      description: Definisce i dettagli di incasso tramite riferimento in anagrafica GovPay.
      type: object
      required:
        - codEntrata
      properties:
        codEntrata:
          type: string
          examples:
            - SRV-12345
          pattern: '(^[a-zA-Z0-9\-_\.]{1,35}$)'

    Bollo:
      description: >-
        Definisce i dati di un bollo telematico. Non ammette
        `dettaglioContabile` (il Dizionario dei metadata di riconciliazione
        contabile pagoPA non si applica al bollo): la classificazione
        avviene solo tramite `tassonomia`.
      type: object
      required:
        - tipoBollo
        - hashDocumento
        - provinciaResidenza
        - tassonomia
      not:
        required:
          - dettaglioContabile
      properties:
        tipoBollo:
          description: Tipologia di Bollo digitale
          type: string
          enum:
            - '01'
        hashDocumento:
          description: Digest in base64 del documento informatico associato alla marca da bollo
          type: string
          examples:
            - "--- base64 ---"
          maxLength: 70
        provinciaResidenza:
          description: Sigla automobilistica della provincia di residenza del soggetto pagatore
          type: string
          examples:
            - "RO"
          pattern: "[A-Z]{2,2}"
        tassonomia:
          $ref: '#/components/schemas/tassonomia'

    Entrata:
      description: Definisce i dettagli di una entrata.
      type: object
      required:
        - ibanAccredito
        - tassonomia
      properties:
        ibanAccredito:
          type: string
          examples:
            - IT60X0542811101000000123456
          pattern: "[a-zA-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}"
        ibanAppoggio:
          type: string
          examples:
            - IT60X0542811101000000123456
          pattern: "[a-zA-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}"
        tassonomia:
          $ref: '#/components/schemas/tassonomia'

    tassonomia:
      type: string
      description: >-
        Tassonomia dei servizi di incasso pagoPA, secondo la sintassi
        Prefisso/CodiceEC/MacroArea/Tipologia/MotivoGiuridico descritta in
        https://developer.pagopa.it/pago-pa/guides/sanp/ente-creditore/tassonomia-dei-servizi-di-incasso.
        Viene riportata così com'è nel campo `transferCategory` dell'RPT
        verso il Nodo dei Pagamenti. Alcuni clienti usano un ulteriore `/`
        seguito da testo libero, in coda alla sintassi standard, per
        annotarvi informazioni proprie: ammesso, ma non interpretato da
        GovPay.
      examples:
        - '9/0101002IM/'
        - '9/0101002IM//rif.pratica123'
      pattern: '^[6789]/[0-9]{7}(IM|TS|SP|SA|AP)/(/.*)?$'

    # ============================================================
    # DETTAGLIO CONTABILE (issue #877)
    # ============================================================

    TipoDettaglioContabile:
      type: string
      description: >-
        Tipologia di dettaglio di riconciliazione contabile. UNKNOWN_ENTRIES
        è generato solo in lettura (metadata non riconosciuti, prodotti da un
        intermediario/tecnologia terza), non ammesso in scrittura.
      enum:
        - CORRISPETTIVO_DL118
        - INCASSO_TIPICO
        - CIVILISTICO
        - SPESE_NOTIFICA
        - UNKNOWN_ENTRIES
      examples:
        - CIVILISTICO

    dettaglio:
      type: object
      description: >-
        Ogni value prodotto verso pagoPA non può eccedere 140 caratteri
        (spazi compresi), per vincolo del dizionario dei metadata.
        SPESE_NOTIFICA va indicato in scrittura solo se l'importo della
        voce include già le spese di notifica SEND calcolate autonomamente
        dall'applicativo; in tal caso `notificaSend` non va attivato sulla
        posizione debitoria, altrimenti le spese verrebbero applicate due
        volte.
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
      oneOf:
        - $ref: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
        - $ref: '#/components/schemas/dettaglioContabileIncassoTipico'
        - $ref: '#/components/schemas/dettaglioContabileCivilistico'
        - $ref: '#/components/schemas/dettaglioContabileImportoNotifica'
      discriminator:
        propertyName: tipo
        mapping:
          CORRISPETTIVO_DL118: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
          INCASSO_TIPICO: '#/components/schemas/dettaglioContabileIncassoTipico'
          CIVILISTICO: '#/components/schemas/dettaglioContabileCivilistico'
          SPESE_NOTIFICA: '#/components/schemas/dettaglioContabileImportoNotifica'

    dettaglioLetto:
      type: object
      description: >-
        Variante in lettura di 'dettaglio': oltre alle tipologie ammesse in
        scrittura, include anche UNKNOWN_ENTRIES (metadata non riconosciuti,
        generati da un intermediario/tecnologia terza).
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
      oneOf:
        - $ref: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
        - $ref: '#/components/schemas/dettaglioContabileIncassoTipico'
        - $ref: '#/components/schemas/dettaglioContabileCivilistico'
        - $ref: '#/components/schemas/dettaglioContabileImportoNotifica'
        - $ref: '#/components/schemas/dettaglioContabileSconosciuto'
      discriminator:
        propertyName: tipo
        mapping:
          CORRISPETTIVO_DL118: '#/components/schemas/dettaglioContabileCorrispettivoDL118'
          INCASSO_TIPICO: '#/components/schemas/dettaglioContabileIncassoTipico'
          CIVILISTICO: '#/components/schemas/dettaglioContabileCivilistico'
          SPESE_NOTIFICA: '#/components/schemas/dettaglioContabileImportoNotifica'
          UNKNOWN_ENTRIES: '#/components/schemas/dettaglioContabileSconosciuto'

    dettaglioContabileCorrispettivoDL118:
      type: object
      required: [tipo, annoCompetenza, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        annoCompetenza:
          type: string
          pattern: '^[0-9]{4}$'
          description: Anno di competenza (RC_AC).
          examples:
            - '2026'
        codiceUfficio:
          type: string
          maxLength: 140
          description: Codice ufficio (RC_CU).
        capitolo:
          type: string
          maxLength: 140
          description: >-
            Capitolo di bilancio (RC_CAP). Alternativo ad "accertamento" e a
            "pianoFinanziario5Livello": deve essere presente uno dei tre.
        accertamento:
          type: string
          maxLength: 140
          description: >-
            Accertamento (RC_ACC), es. "2023/1233". Alternativo a "capitolo"
            e a "pianoFinanziario5Livello".
        articolo:
          type: string
          maxLength: 140
          description: Articolo di bilancio (RC_ART).
        pianoFinanziario5Livello:
          type: string
          maxLength: 140
          description: Piano finanziario 5° livello (RC_PF5).
          examples:
            - 'E.1.01.01.20.001'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio (RC_IMP).

    dettaglioContabileIncassoTipico:
      type: object
      required: [tipo, annoCompetenza, tipoIncasso, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        annoCompetenza:
          type: string
          pattern: '^[0-9]{4}$'
          description: Anno di competenza (RC_AC).
        codiceUfficio:
          type: string
          maxLength: 140
          description: Codice ufficio (RC_CU).
        tipoIncasso:
          type: string
          maxLength: 140
          description: Tipo incasso / voce economica (RC_TI).
          examples:
            - 'DIRITTI DI SEGRETERIA'
        emissioneFattura:
          type: string
          enum: [SI, NO]
          description: 'Emissione fattura (RC_EF). Alternativo a "nrDocumento".'
        nrDocumento:
          type: string
          maxLength: 140
          description: 'Numero documento (RC_ND). Alternativo a "emissioneFattura".'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio (RC_IMP).

    dettaglioContabileCivilistico:
      type: object
      required: [tipo, annoCompetenza, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        annoCompetenza:
          type: string
          pattern: '^[0-9]{4}$'
          description: Anno di competenza (RC_AC).
        codiceUfficio:
          type: string
          maxLength: 140
          description: Codice ufficio (RC_CU).
        conto:
          type: string
          maxLength: 140
          description: >-
            Conto (RC_CON), es. "14.01.03". Alternativo a "commessa" e
            "nrDocumento": uno dei tre deve essere presente.
        commessa:
          type: string
          maxLength: 140
          description: 'Commessa (RC_COM). Alternativo a "conto" e "nrDocumento".'
        nrDocumento:
          type: string
          maxLength: 140
          description: 'Numero documento (RC_ND). Alternativo a "conto" e "commessa".'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio (RC_IMP).

    dettaglioContabileImportoNotifica:
      type: object
      description: >-
        Corrisponde alla sezione "Spese di notifica SEND" del Dizionario
        dei metadata pagoPA. In lettura è normalmente generato da GovPay
        stesso, quando `notificaSend` è attivo sulla posizione debitoria.
        Può essere indicato anche in scrittura dall'applicativo, ma solo
        nel caso in cui l'importo della voce includa già tali spese
        calcolate autonomamente (vedi `dettaglio`).
      required: [tipo, importo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        importo:
          type: number
          format: double
          minimum: 0.01
          description: Importo del dettaglio.

    dettaglioContabileSconosciuto:
      type: object
      description: >-
        Fallback per metadata che non corrispondono a nessuna delle
        tipologie catalogate: presente solo se generato da un altro
        intermediario/tecnologia terza, non da GovPay in scrittura.
      required: [tipo, entries]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDettaglioContabile'
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [chiave, valore]
            properties:
              chiave:
                type: string
              valore:
                type: string

    # ============================================================
    # AVVISO
    # ============================================================

    Avviso:
      type: object
      required:
        - stato
      properties:
        stato:
          $ref: '#/components/schemas/StatoAvviso'
        importo:
          type: number
          description: Importo della pendenza associata all'avviso.
          examples:
            - 10.01
        idDominio:
          type: string
          description: Identificativo del creditore dell'avviso
          examples:
            - '01234567890'
        numeroAvviso:
          type: string
          description: Numero identificativo dell'avviso di pagamento
          examples:
            - '00100000000000012'
        dataValidita:
          type: string
          format: date
          description: Data di validita dei dati dell'avviso, decorsa la quale l'importo può subire variazioni.
          examples:
            - '2019-12-31'
        dataScadenza:
          type: string
          format: date
          description: >-
            Data di scadenza dell'avviso, decorsa la quale non è più
            pagabile: coincide con la data di scadenza da stampare della
            pendenza, o in assenza con quella dell'opzione di pagamento a
            cui appartiene.
          examples:
            - '2020-12-31'
        dataPagamento:
          type: string
          format: date
          description: Data di pagamento dell'avviso.
          examples:
            - '2020-12-31'
        descrizione:
          type: string
          description: Descrizione da inserire nell'avviso di pagamento
          examples:
            - 'Sanzione CdS n. abc00000'
        qrcode:
          type: string
          description: Testo da codificare nel qr-code dell'avviso
        barcode:
          type: string
          description: Testo da codificare nel bar-code dell'avviso

    StatoAvviso:
      description: Stato dell'avviso
      examples:
        - Non pagato
      type: string
      enum:
        - DUPLICATA
        - NON_ESEGUITA
        - ANNULLATA
        - SCONOSCIUTA
        - SCADUTA

    # ============================================================
    # RICEVUTE
    # ============================================================

    Ricevute:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/RicevutaIndex'

    RicevutaIndex:
      type: object
      description: >-
        Riferimento a una ricevuta di pagamento (RT) emessa da pagoPA per
        la pendenza. Il contenuto della ricevuta si recupera tramite
        `GET /pendenze/{idA2A}/{idPendenza}/ricevute/{iur}`.
      required:
        - iur
        - tipo
        - data
      properties:
        iur:
          type: string
          description: Identificativo univoco di riscossione.
          examples:
            - '1234acdc'
        tipo:
          $ref: '#/components/schemas/TipoRicevuta'
        data:
          type: string
          format: date-time
          description: Data di acquisizione della ricevuta.
          examples:
            - '2020-12-31T12:55:12Z'

    TipoRicevuta:
      type: string
      description: >-
        Formato XML della ricevuta: `ctRicevutaTelematica` è il formato
        SANP storico, `ctReceipt` e `ctReceiptV2` sono i formati più
        recenti del Nodo dei Pagamenti.
      enum:
        - ctRicevutaTelematica
        - ctReceipt
        - ctReceiptV2
      examples:
        - ctReceiptV2

    Ricevuta:
      type: object
      description: >-
        Ricevuta di pagamento (RT) originale emessa da pagoPA. La forma
        varia in base al campo `tipo`, che identifica il formato XML
        pagoPA da cui la ricevuta è stata convertita: ciascun formato ha
        i propri campi.
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoRicevuta'
      oneOf:
        - $ref: '#/components/schemas/RicevutaCtRicevutaTelematica'
        - $ref: '#/components/schemas/RicevutaCtReceipt'
        - $ref: '#/components/schemas/RicevutaCtReceiptV2'
      discriminator:
        propertyName: tipo
        mapping:
          ctRicevutaTelematica: '#/components/schemas/RicevutaCtRicevutaTelematica'
          ctReceipt: '#/components/schemas/RicevutaCtReceipt'
          ctReceiptV2: '#/components/schemas/RicevutaCtReceiptV2'

    # --- ctRicevutaTelematica (formato SANP storico) ---

    TipoIdentificativoUnivocoRT:
      description: >-
        Natura del codice che identifica il soggetto in una ricevuta ctRicevutaTelematica
        (SANP 2.3.0): F persona fisica, G persona giuridica (soggetto versante/pagatore o
        ente beneficiario), A codice ABI, B codice BIC (istituto attestante — qui la natura
        del codice e il tipo di soggetto, non sovrapponibile a TipoSoggetto, che modella solo
        persona fisica/giuridica).
      type: string
      enum:
        - F
        - G
        - A
        - B
      examples:
        - G

    RTIdentificativoUnivoco:
      type: object
      required:
        - tipoIdentificativoUnivoco
        - codiceIdentificativoUnivoco
      properties:
        tipoIdentificativoUnivoco:
          $ref: '#/components/schemas/TipoIdentificativoUnivocoRT'
        codiceIdentificativoUnivoco:
          type: string

    RTAnagrafica:
      type: object
      description: >-
        Anagrafica di un soggetto (versante, pagatore, ente beneficiario o
        istituto attestante) come riportata nella ricevuta
        `ctRicevutaTelematica`.
      required:
        - identificativoUnivoco
        - denominazione
      properties:
        identificativoUnivoco:
          $ref: '#/components/schemas/RTIdentificativoUnivoco'
        denominazione:
          type: string
          description: Nominativo o ragione sociale del soggetto.
        codiceUnitaOperativa:
          type: string
        denominazioneUnitaOperativa:
          type: string
        indirizzo:
          type: string
        civico:
          type: string
        cap:
          type: string
        localita:
          type: string
        provincia:
          type: string
        nazione:
          type: string
        email:
          type: string

    RTAllegatoRicevuta:
      type: object
      required:
        - tipoAllegatoRicevuta
        - testoAllegato
      properties:
        tipoAllegatoRicevuta:
          type: string
          description: Tipo dell'allegato trasportato con la ricevuta.
        testoAllegato:
          type: string
          format: byte
          description: Contenuto dell'allegato, codificato in base64.

    RTDatiSingoloPagamento:
      type: object
      required:
        - singoloImportoPagato
        - dataEsitoSingoloPagamento
        - identificativoUnivocoRiscossione
        - causaleVersamento
        - datiSpecificiRiscossione
      properties:
        singoloImportoPagato:
          type: number
          description: Importo versato. Se il pagamento non è stato eseguito, vale 0.00.
        esitoSingoloPagamento:
          type: string
          description: >-
            Descrizione testuale dell'esito del singolo pagamento.
            Presente se `singoloImportoPagato` vale 0.00.
        dataEsitoSingoloPagamento:
          type: string
          format: date
        identificativoUnivocoRiscossione:
          type: string
        causaleVersamento:
          type: string
        datiSpecificiRiscossione:
          type: string
          description: >-
            Imputazione della specifica entrata, nella forma
            "tipo contabilità"/"codice contabilità".
        commissioniApplicatePSP:
          type: number
        commissioniApplicatePA:
          type: number
        allegatoRicevuta:
          $ref: '#/components/schemas/RTAllegatoRicevuta'

    RicevutaCtRicevutaTelematica:
      type: object
      description: Ricevuta nel formato XML SANP storico `ctRicevutaTelematica`.
      required:
        - tipo
        - versioneOggetto
        - dominio
        - identificativoMessaggioRicevuta
        - dataOraMessaggioRicevuta
        - riferimentoMessaggioRichiesta
        - riferimentoDataRichiesta
        - istitutoAttestante
        - enteBeneficiario
        - soggettoPagatore
        - datiPagamento
      properties:
        tipo:
          $ref: '#/components/schemas/TipoRicevuta'
        versioneOggetto:
          type: string
        dominio:
          type: object
          required:
            - identificativoDominio
          properties:
            identificativoDominio:
              type: string
            identificativoStazioneRichiedente:
              type: string
        identificativoMessaggioRicevuta:
          type: string
        dataOraMessaggioRicevuta:
          type: string
          format: date-time
        riferimentoMessaggioRichiesta:
          type: string
        riferimentoDataRichiesta:
          type: string
          format: date
        istitutoAttestante:
          $ref: '#/components/schemas/RTAnagrafica'
        enteBeneficiario:
          $ref: '#/components/schemas/RTAnagrafica'
        soggettoVersante:
          $ref: '#/components/schemas/RTAnagrafica'
        soggettoPagatore:
          $ref: '#/components/schemas/RTAnagrafica'
        datiPagamento:
          type: object
          required:
            - codiceEsitoPagamento
            - importoTotalePagato
            - identificativoUnivocoVersamento
            - codiceContestoPagamento
          properties:
            codiceEsitoPagamento:
              type: integer
              description: >-
                Esito del pagamento:
                 * 0 = Pagamento eseguito
                 * 1 = Pagamento non eseguito
                 * 2 = Pagamento parzialmente eseguito
                 * 3 = Decorrenza termini
                 * 4 = Decorrenza termini parziale
              enum:
                - 0
                - 1
                - 2
                - 3
                - 4
            importoTotalePagato:
              type: number
            identificativoUnivocoVersamento:
              type: string
            codiceContestoPagamento:
              type: string
            datiSingoloPagamento:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RTDatiSingoloPagamento'

    # --- ctReceipt / ctReceiptV2 (formati recenti del Nodo dei Pagamenti) ---

    RTMetadata:
      type: array
      description: Metadata pagoPA associati (Dizionario dei metadata).
      items:
        $ref: '#/components/schemas/RTMetadataEntry'

    RTMetadataEntry:
      type: object
      required:
        - chiave
        - valore
      properties:
        chiave:
          type: string
        valore:
          type: string

    RTSubject:
      type: object
      required:
        - uniqueIdentifier
        - fullName
      properties:
        uniqueIdentifier:
          type: object
          required:
            - entityUniqueIdentifierType
            - entityUniqueIdentifierValue
          properties:
            entityUniqueIdentifierType:
              $ref: '#/components/schemas/TipoSoggetto'
            entityUniqueIdentifierValue:
              type: string
        fullName:
          type: string
        streetName:
          type: string
        civicNumber:
          type: string
        postalCode:
          type: string
        city:
          type: string
        stateProvinceRegion:
          type: string
        country:
          type: string
        email:
          type: string

    RTTransfer:
      type: object
      description: Transfer secondo il formato `ctReceipt`.
      required:
        - idTransfer
        - transferAmount
        - fiscalCodePA
        - IBAN
        - remittanceInformation
        - transferCategory
      properties:
        idTransfer:
          type: string
        transferAmount:
          type: number
        fiscalCodePA:
          type: string
        IBAN:
          type: string
        remittanceInformation:
          type: string
        transferCategory:
          type: string
        metadata:
          $ref: '#/components/schemas/RTMetadata'

    RTTransferV2:
      type: object
      description: Transfer secondo il formato `ctReceiptV2`.
      required:
        - idTransfer
        - transferAmount
        - fiscalCodePA
        - remittanceInformation
        - transferCategory
      properties:
        idTransfer:
          type: string
        transferAmount:
          type: number
        fiscalCodePA:
          type: string
        companyName:
          type: string
        IBAN:
          type: string
          description: Alternativo a `MBDAttachment`. Esattamente uno dei due è presente.
        MBDAttachment:
          type: string
          format: byte
          description: Alternativo a `IBAN`, codificato in base64. Esattamente uno dei due è presente.
        remittanceInformation:
          type: string
        transferCategory:
          type: string
        metadata:
          $ref: '#/components/schemas/RTMetadata'

    RTReceiptBase:
      type: object
      description: Campi comuni a `ctReceipt` e `ctReceiptV2`, esclusi `tipo` e `transferList`.
      required:
        - receiptId
        - noticeNumber
        - fiscalCode
        - outcome
        - creditorReferenceId
        - paymentAmount
        - description
        - companyName
        - debtor
        - idPSP
        - PSPCompanyName
        - idChannel
        - channelDescription
      properties:
        receiptId:
          type: string
        noticeNumber:
          type: string
        fiscalCode:
          type: string
        outcome:
          type: string
          enum:
            - OK
            - KO
        creditorReferenceId:
          type: string
        paymentAmount:
          type: number
        description:
          type: string
        companyName:
          type: string
        officeName:
          type: string
        debtor:
          $ref: '#/components/schemas/RTSubject'
        idPSP:
          type: string
        pspFiscalCode:
          type: string
        pspPartitaIVA:
          type: string
        PSPCompanyName:
          type: string
        idChannel:
          type: string
        channelDescription:
          type: string
        payer:
          $ref: '#/components/schemas/RTSubject'
        paymentMethod:
          type: string
        fee:
          type: number
        paymentDateTime:
          type: string
          format: date-time
        applicationDate:
          type: string
          format: date
        transferDate:
          type: string
          format: date
        metadata:
          $ref: '#/components/schemas/RTMetadata'
        standIn:
          type: boolean

    RicevutaCtReceipt:
      type: object
      description: Ricevuta nel formato `ctReceipt` del Nodo dei Pagamenti.
      allOf:
        - $ref: '#/components/schemas/RTReceiptBase'
        - type: object
          required:
            - tipo
            - transferList
          properties:
            tipo:
              $ref: '#/components/schemas/TipoRicevuta'
            transferList:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RTTransfer'

    RicevutaCtReceiptV2:
      type: object
      description: Ricevuta nel formato `ctReceiptV2` del Nodo dei Pagamenti.
      allOf:
        - $ref: '#/components/schemas/RTReceiptBase'
        - type: object
          required:
            - tipo
            - transferList
          properties:
            tipo:
              $ref: '#/components/schemas/TipoRicevuta'
            transferList:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/RTTransferV2'
            paymentNote:
              type: string
            primaryCiIncurredFee:
              type: number
            idBundle:
              type: string
            idCiBundle:
              type: string

    # ============================================================
    # RENDICONTAZIONI
    # ============================================================

    Rendicontazioni:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Rendicontazione'

    Rendicontazione:
      type: object
      description: >-
        Occorrenza di pagamento della pendenza all'interno di un flusso di
        rendicontazione ricevuto da pagoPA.
      required:
        - iuv
        - iur
        - importo
        - esito
        - data
        - stato
        - flusso
      properties:
        iuv:
          type: string
          description: Identificativo univoco di versamento.
          examples:
            - '01000000202012345'
        iur:
          type: string
          description: Identificativo univoco di riscossione.
          examples:
            - '1234acdc'
        indice:
          type: number
          description: >-
            Indice dell'occorrenza del pagamento all'interno della
            struttura `datiSingoloPagamento` della ricevuta telematica.
          examples:
            - 1
        importo:
          type: number
          description: Importo rendicontato.
          examples:
            - 10.01
        esito:
          type: number
          description: >-
            Codice di esito dell'operazione rendicontata:
             * 0 = Pagamento eseguito
             * 3 = Pagamento revocato
             * 9 = Pagamento eseguito in assenza di RPT
          enum:
            - 0
            - 3
            - 9
          examples:
            - 0
        data:
          type: string
          format: date
          description: Data di esito.
          examples:
            - '2018-12-31'
        stato:
          $ref: '#/components/schemas/StatoRendicontazione'
        flusso:
          $ref: '#/components/schemas/FlussoRendicontazione'

    StatoRendicontazione:
      description: Stato della rendicontazione.
      type: string
      enum:
        - OK
        - ANOMALA
        - ALTRO_INTERMEDIARIO
      examples:
        - OK

    FlussoRendicontazione:
      type: object
      description: Dati di testata del flusso di rendicontazione.
      required:
        - idFlusso
        - dataFlusso
        - trn
        - dataRegolamento
        - idPsp
        - numeroPagamenti
        - importoTotale
        - stato
      properties:
        idFlusso:
          type: string
          description: Identificativo del flusso di rendicontazione.
          examples:
            - '2017-11-21GovPAYPsp1-10:27:27.903'
        dataFlusso:
          type: string
          format: date-time
          description: Data di emissione del flusso.
          examples:
            - '2020-12-31T10:27:27.903Z'
        trn:
          type: string
          description: >-
            Identificativo dell'operazione di riversamento assegnato dal
            PSP debitore.
          examples:
            - idriversamento12345
        dataRegolamento:
          type: string
          format: date-time
          description: Data dell'operazione di riversamento fondi.
          examples:
            - '2020-12-31T10:27:27.903Z'
        idPsp:
          type: string
          description: Identificativo dell'istituto mittente.
          examples:
            - ABI-12345
        bicRiversamento:
          type: string
          description: Codice BIC della banca che ha generato il riversamento.
          examples:
            - BIC-12345
        numeroPagamenti:
          type: number
          description: Numero di pagamenti oggetto della rendicontazione.
          examples:
            - 3
        importoTotale:
          type: number
          format: double
          description: Somma degli importi rendicontati.
          examples:
            - 100.01
        stato:
          $ref: '#/components/schemas/StatoFlussoRendicontazione'

    StatoFlussoRendicontazione:
      description: >-
        Stato del flusso di rendicontazione, allineato 1:1 ai valori legacy
        di `fr.stato` (stessa colonna condivisa da v2 e v3).
      type: string
      enum:
        - ACCETTATA
        - ANOMALA
        - RIFIUTATA
      examples:
        - ACCETTATA

    StatoPendenza:
      description: >-
        Stato della pendenza, allineato 1:1 ai valori legacy di
        `versamenti.stato_versamento` (stessa colonna condivisa da v2 e v3).
        Non esiste uno stato "scaduta": la pagabilità dipende da
        `dataScadenza` dell'opzione di pagamento (o da `dataScadenzaAvviso`
        della pendenza, in sua assenza), calcolata a runtime, non uno stato
        persistito.
      examples:
        - NON_ESEGUITO
      type: string
      enum:
        - NON_ESEGUITO
        - ESEGUITO
        - PARZIALMENTE_ESEGUITO
        - ANNULLATO
        - ESEGUITO_ALTRO_CANALE
        - ANOMALO
        - ESEGUITO_SENZA_RPT
        - INCASSATO

    StatoVocePendenza:
      type: string
      description: >-
        Stato della voce di pagamento. NON_ESEGUITO/ESEGUITO coincidono per
        stringa con lo stato legacy di `singoli_versamenti`; ANOMALO è un
        valore proprio di v3, senza equivalente legacy.
      enum:
        - NON_ESEGUITO
        - ESEGUITO
        - ANOMALO
      examples:
        - NON_ESEGUITO

    Dominio:
      type: object
      required:
        - idDominio
        - ragioneSociale
      properties:
        idDominio:
          type: string
          description: Codice fiscale
          examples:
            - '01234567890'
          minLength: 1
          maxLength: 35
        ragioneSociale:
          type: string
          description: Ragione sociale
          examples:
            - Comune Dimostrativo
          minLength: 1
          maxLength: 70
        indirizzo:
          type: string
          examples:
            - Piazza della Vittoria
          minLength: 1
          maxLength: 70
        civico:
          type: string
          examples:
            - 10/A
          minLength: 1
